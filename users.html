<script src="shared/shared.js?v=80"></script>
<script>
(function () {
  "use strict";
  var PM = window.PM;
  var usersSearchQuery = "";
  var users = [];
  // Department groups default expanded; toggling one off adds it here.
  // Keyed by department name, with UNASSIGNED_KEY standing in for users with
  // no department on record (matches the source HR system's "unassigned"
  // bucket, sorted last there too).
  var UNASSIGNED_KEY = "␀unassigned";
  var collapsedDepts = new Set();
  function esc(s) { return PM.esc(s); }
  function tr(key) { return PM.tr(key); }

  function matchesSearch(u) {
    if (!usersSearchQuery) return true;
    var q = usersSearchQuery.toLowerCase();
    return (u.name || "").toLowerCase().indexOf(q) !== -1 || (u.email || "").toLowerCase().indexOf(q) !== -1;
  }

  function roleOptionsHtml(selected) {
    return ["admin", "member", "viewer"].map(function (r) {
      return '<option value="' + r + '"' + (r === selected ? " selected" : "") + '>' + esc(tr("users.role." + r)) + '</option>';
    }).join("");
  }

  // Groups the flat user list by department, mirroring how the source HR /
  // handover-form system buckets its own user list — same key (department),
  // same "unassigned users sort last" rule.
  function groupUsersByDepartment(list) {
    var groups = [];
    list.forEach(function (u) {
      var name = (u.department || "").trim();
      var key = name || UNASSIGNED_KEY;
      var group = groups.find(function (g) { return g.key === key; });
      if (!group) { group = { key: key, name: name, items: [] }; groups.push(group); }
      group.items.push(u);
    });
    groups.sort(function (a, b) {
      if (a.key === UNASSIGNED_KEY) return 1;
      if (b.key === UNASSIGNED_KEY) return -1;
      return a.name.localeCompare(b.name, "th");
    });
    return groups;
  }

  function renderRow(u) {
    return '<tr data-user="' + esc(u.id) + '">' +
      '<td><div class="users-name-cell">' +
        '<div class="owner-avatar" style="background:' + PM.avatarColor(u.name) + '">' + esc(PM.initials(u.name)) + '</div>' +
        '<input type="text" class="task-name-input" data-field="name" value="' + esc(u.name) + '" placeholder="' + esc(tr("users.namePlaceholder")) + '" />' +
      '</div></td>' +
      '<td><input type="text" class="task-name-input" data-field="email" value="' + esc(u.email || "") + '" placeholder="' + esc(tr("users.emailPlaceholder")) + '" /></td>' +
      '<td><select class="pill role-' + u.role + '" data-field="role">' + roleOptionsHtml(u.role) + '</select></td>' +
      '<td><input type="password" class="task-name-input" data-field="password" value="" placeholder="' + esc(tr("users.passwordPlaceholder")) + '" autocomplete="new-password" /></td>' +
      '<td><div style="display:flex;gap:4px;">' +
        '<button class="icon-square-btn save-user-btn" data-action="save-user" disabled title="' + esc(tr("users.save")) + '">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M4 12l5 5L20 6"/></svg>' +
        '</button>' +
        '<button class="icon-square-btn danger" data-action="delete-user" title="' + esc(tr("users.deleteAction")) + '">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0l-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6"/></svg>' +
        '</button>' +
      '</div></td>' +
    '</tr>';
  }

  function renderGroup(g) {
    var visibleItems = g.items.filter(matchesSearch);
    if (usersSearchQuery && visibleItems.length === 0) return "";
    var collapsed = collapsedDepts.has(g.key);
    var label = g.key === UNASSIGNED_KEY ? tr("users.unassignedGroup") : g.name;
    return '<div class="group' + (collapsed ? ' collapsed' : '') + '" data-dept="' + esc(g.key) + '">' +
      '<div class="group-head">' +
        '<button class="group-collapse" data-action="toggle-dept" data-dept="' + esc(g.key) + '" aria-label="ย่อ/ขยายกลุ่ม">' +
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>' +
        '</button>' +
        '<span class="group-name">' + esc(label) + '</span>' +
        '<span class="group-count">' + g.items.length + '</span>' +
      '</div>' +
      '<div class="ws-table-wrap">' +
        '<table class="ws-table users-table">' +
          '<thead><tr>' +
            '<th style="width:26%;">' + esc(tr("users.name")) + '</th>' +
            '<th style="width:24%;">' + esc(tr("users.email")) + '</th>' +
            '<th style="width:14%;">' + esc(tr("users.role")) + '</th>' +
            '<th style="width:18%;">' + esc(tr("users.password")) + '</th>' +
            '<th style="width:110px;">' + esc(tr("users.actions")) + '</th>' +
          '</tr></thead>' +
          '<tbody>' + visibleItems.map(renderRow).join("") + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
  }

  function render() {
    var body = document.getElementById("usersGroups");
    var groups = groupUsersByDepartment(users);
    var html = groups.map(renderGroup).join("");
    body.innerHTML = html || '<div class="dept-group-empty">' + esc(tr("users.noUsers")) + '</div>';

    var n = users.length;
    document.getElementById("usersSub").textContent = tr("users.sub").replace("{n}", n).replace("{s}", n === 1 ? "" : "s");
    PM.syncSidebarLinks();
    PM.renderSidebarProgress();
  }

  function findUser(id) { return users.find(function (u) { return u.id === id; }); }

  // ---------------- save status ----------------
  // Each row saves independently (existing pattern), but we also track which
  // rows are dirty so the toolbar can show one combined status + a "Save
  // all" button, instead of only the per-row disabled/enabled Save icon.
  var dirtyUserIds = new Set();
  var savingUserIds = new Set();

  function updateSaveStatus() {
    var el = document.getElementById("saveStatus");
    var textEl = document.getElementById("saveStatusText");
    var saveAllBtn = document.getElementById("saveAllBtn");
    var state = savingUserIds.size ? "saving" : (dirtyUserIds.size ? "dirty" : "idle");
    el.dataset.state = state;
    textEl.textContent = tr("save." + state);
    saveAllBtn.disabled = dirtyUserIds.size === 0 || savingUserIds.size > 0;
    saveAllBtn.classList.toggle("dirty", state === "dirty" || state === "saving");
  }

  function markDirty(row) {
    var btn = row.querySelector(".save-user-btn");
    if (btn) btn.disabled = false;
    dirtyUserIds.add(row.dataset.user);
    updateSaveStatus();
  }

  function saveRow(id) {
    var row = document.querySelector('tr[data-user="' + id + '"]');
    if (!row) return Promise.resolve();
    var u = findUser(id);
    if (!u) return Promise.resolve();
    var name = row.querySelector('[data-field="name"]').value.trim();
    var email = row.querySelector('[data-field="email"]').value.trim();
    var role = row.querySelector('[data-field="role"]').value;
    var passwordEl = row.querySelector('[data-field="password"]');
    var password = passwordEl.value;
    if (!name) { PM.showToast(tr("users.nameRequired")); return Promise.resolve(); }
    if (password && password.length < 6) { PM.showToast(tr("auth.passwordHint")); return Promise.resolve(); }

    var btn = row.querySelector(".save-user-btn");
    if (btn) btn.disabled = true;
    savingUserIds.add(id);
    updateSaveStatus();

    var payload = { name: name, email: email, role: role };
    if (password) payload.password = password;

    return PM.updateUserApi(id, payload).then(function (updated) {
      var idx = users.findIndex(function (x) { return x.id === id; });
      if (idx !== -1) users[idx] = updated;
      passwordEl.value = "";
      var avatar = row.querySelector(".owner-avatar");
      if (avatar) { avatar.style.background = PM.avatarColor(updated.name); avatar.textContent = PM.initials(updated.name); }
      var roleSelect = row.querySelector('[data-field="role"]');
      if (roleSelect) roleSelect.className = "pill role-" + updated.role;
      PM.showToast(tr("users.userUpdated"));
      dirtyUserIds.delete(id);
      savingUserIds.delete(id);
      updateSaveStatus();
    }).catch(function () {
      PM.showToast(tr("users.saveError"));
      if (btn) btn.disabled = false;
      savingUserIds.delete(id);
      updateSaveStatus();
    });
  }

  document.getElementById("usersSearchInput").addEventListener("input", function (e) { usersSearchQuery = e.target.value; render(); });
  document.getElementById("usersSearchBox").addEventListener("focusin", function () { this.classList.add("focused"); });
  document.getElementById("usersSearchBox").addEventListener("focusout", function () { this.classList.remove("focused"); });

  document.getElementById("usersAddBtn").addEventListener("click", function () {
    PM.createUserApi({ name: PM.lang === "th" ? "ผู้ใช้งานใหม่" : "New user", email: "", role: "member" })
      .then(function (u) {
        users.push(u);
        render();
        PM.showToast(tr("users.userAdded"));
        var row = document.querySelector('tr[data-user="' + u.id + '"] input[data-field="name"]');
        if (row) { row.focus(); row.select(); }
      })
      .catch(function () { PM.showToast(tr("users.saveError")); });
  });

  document.getElementById("saveAllBtn").addEventListener("click", function () {
    var ids = Array.from(dirtyUserIds);
    Promise.all(ids.map(saveRow));
  });

  var tableBody = document.getElementById("usersGroups");

  // Typing/selecting only marks the row dirty (enables Save) — nothing is
  // sent to the server until Save is clicked, same pattern as the project
  // day budget on the board page.
  tableBody.addEventListener("input", function (e) {
    var field = e.target.dataset.field;
    if (!field) return;
    var row = e.target.closest("tr[data-user]");
    if (row) markDirty(row);
  });
  tableBody.addEventListener("change", function (e) {
    if (e.target.dataset.field !== "role") return;
    var row = e.target.closest("tr[data-user]");
    if (row) markDirty(row);
  });

  tableBody.addEventListener("click", function (e) {
    var toggleBtn = e.target.closest('[data-action="toggle-dept"]');
    if (toggleBtn) {
      var key = toggleBtn.dataset.dept;
      if (collapsedDepts.has(key)) collapsedDepts.delete(key); else collapsedDepts.add(key);
      render();
      return;
    }
    var saveBtn = e.target.closest('[data-action="save-user"]');
    if (saveBtn && !saveBtn.disabled) {
      var saveRowEl = saveBtn.closest("tr[data-user]");
      if (saveRowEl) saveRow(saveRowEl.dataset.user);
      return;
    }
    var delBtn = e.target.closest('[data-action="delete-user"]');
    if (!delBtn) return;
    var row = delBtn.closest("tr[data-user]");
    if (!row) return;
    var id = row.dataset.user;
    var u = findUser(id);
    if (!u) return;
    if (!confirm(tr("users.deleteConfirm").replace("{name}", u.name || ""))) return;
    PM.deleteUserApi(id).then(function () {
      users = users.filter(function (x) { return x.id !== id; });
      dirtyUserIds.delete(id);
      savingUserIds.delete(id);
      updateSaveStatus();
      render();
      PM.showToast(tr("users.userRemoved"));
    }).catch(function () { PM.showToast(tr("users.deleteError")); });
  });

  // ---------------- init ----------------
  // Gated: nothing else runs until the session is confirmed valid server-side.

  PM.requireAuth().then(function () {
    // Manage Users is admin-only (its write routes 403 for anyone else
    // server-side too) — a member/viewer landing here directly by URL gets
    // bounced back rather than shown a page full of controls that'd only
    // ever fail. ?denied=1 lets workspace.html toast an explanation once
    // it lands there, since a toast fired here would vanish instantly.
    if (!PM.currentUser || PM.currentUser.role !== "admin") {
      window.location.replace("workspace.html?denied=1");
      return;
    }
    PM.resolveProjectId();
    PM.state = PM.loadCachedState() || PM.seedState();
    PM.initSidebar("users", render);
    render();

    if (PM.currentProjectId) {
      PM.fetchProjectState(PM.currentProjectId).then(function (data) {
        PM.state = data;
        render();
      }).catch(function () {});
    }

    PM.loadUsers().then(function (list) {
      users = list;
      render();
    }).catch(function () {
      PM.showToast(tr("users.loadError"));
    });
  }).catch(function () {}); // requireAuth already redirected to login.html
})();
</script>
