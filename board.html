<meta charset="utf-8" />
<title>IT Project Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Mitr:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/styles.css" />

<button class="sidebar-reopen" id="sidebarReopenBtn" aria-label="เปิดแถบด้านข้าง">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
</button>

<div class="shell">
  <!-- ============ Sidebar ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sb-top">
        <span class="sb-top-label" data-i18n="sb.workspace">Workspace</span>
        <div class="sb-top-icons">
          <button class="sb-icon-btn" data-toast="เมนูเพิ่มเติมยังไม่เปิดใช้งานในตัวอย่างนี้" aria-label="เมนู">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </button>
          <button class="sb-icon-btn" id="sidebarCollapseBtn" aria-label="ย่อแถบด้านข้าง">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 6l-6 6 6 6M18 6l-6 6 6 6"/></svg>
          </button>
        </div>
      </div>

      <div class="sb-logo-row">
        <div class="sb-logo-badge">
          <img src="fatima-logo.svg?v=3" alt="Fatima" />
        </div>
      </div>
      <div class="sb-workspace-row" data-toast="สลับ workspace ยังไม่เปิดใช้งานในตัวอย่างนี้">
        <div class="sb-workspace-text">
          <div class="sb-workspace-name" id="sbWorkspaceName" data-i18n="sb.mainWorkspace">Fatima workspace</div>
          <div class="sb-workspace-caption" data-i18n="sb.caption">Project management</div>
        </div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" style="color:var(--sb-text-faint);flex-shrink:0;"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <button class="sb-add-workspace" data-toast="เพิ่ม workspace ใหม่ยังไม่เปิดใช้งานในตัวอย่างนี้" style="display:none;" aria-label="เพิ่ม workspace"></button>
      <div class="sb-divider"></div>

      <div class="sb-section-label" id="sbContentLabel">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>
        <span data-i18n="sb.content">Content</span>
      </div>
      <div class="sb-nav-list" id="sbNavList">
        <a class="sb-nav-item" data-view="workspace" href="workspace.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span data-i18n="sb.manageWorkspace">Manage workspace</span>
        </a>
        <a class="sb-nav-item" data-view="users" href="users.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20v-1.5a3.5 3.5 0 00-3.5-3.5h-5A3.5 3.5 0 005 18.5V20"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M19 20v-1.5a3.5 3.5 0 00-2.5-3.36M14.5 4.1a3.5 3.5 0 010 6.8"/></svg>
          <span data-i18n="sb.manageUsers">Manage users</span>
        </a>
        <a class="sb-nav-item" data-view="board" id="sbBoardLink" href="board.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
          <span id="sbBoardLabel">Test Project</span>
        </a>
        <a class="sb-nav-item" data-view="dashboard" id="sbDashboardLink" href="dashboard.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 16v-4M12 16V8M16 16v-7"/></svg>
          <span data-i18n="sb.dashboard">Dashboard and reporting</span>
        </a>
      </div>

      <div class="sb-spacer"></div>

      <div class="sb-auth-row">
        <span class="sb-auth-name" id="sbAuthName"></span>
        <button class="sb-logout-btn" id="sbLogoutBtn" data-i18n="auth.logout" type="button">Log out</button>
      </div>

      <button class="lang-toggle-btn" id="langToggleBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"/></svg>
        <span id="langToggleLabel">ไทย</span>
      </button>

      <div class="sb-progress-card">
        <div class="sb-progress-label" data-i18n="sb.progressLabel">Project progress</div>

        <div class="sb-progress-sub" id="sbProgressSub"></div>
        <a class="sb-progress-btn" id="sbProgressBtn" href="dashboard.html" data-i18n="sb.progressBtn">View details</a>
      </div>
    </div>
  </aside>

  <!-- ============ Main area ============ -->
  <div class="main-area" id="mainArea">
    <div class="app view-panel active" id="boardView">
  <!-- ============ Top bar ============ -->
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:6px;">
      <input id="boardTitle" class="project-title-input" value="IT Project" />
      <button class="chev-btn" data-toast="เมนูโปรเจกต์ยังไม่เปิดใช้งานในตัวอย่างนี้" aria-label="เมนูโปรเจกต์">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="topbar-actions">
      <button class="icon-square-btn" data-toast="ยังไม่มีข้อความใหม่">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-9 8.5A8.38 8.38 0 013 11.5a8.5 8.5 0 0117 0z"/></svg>
      </button>
      <div class="avatar-circle" data-toast="โปรไฟล์ของคุณ" title="โปรไฟล์">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </div>
      <button class="invite-btn" id="inviteBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3-5 7-5s7 1.7 7 5M17 8h5M19.5 5.5v5"/></svg>
        <span data-i18n="tb.invite">Invite</span><span id="inviteCountBadge"></span>
      </button>
      <button class="icon-square-btn" data-toast="คัดลอกลิงก์บอร์ดแล้ว">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 15l6-6M10 6l1-1a3.5 3.5 0 015 5l-1 1M14 18l-1 1a3.5 3.5 0 01-5-5l1-1"/></svg>
      </button>
      <div style="position:relative;">
        <button class="icon-square-btn" id="topMenuBtn" aria-label="เมนูบอร์ด">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        </button>
        <div class="group-popover" id="topMenuPopover" style="display:none; width: 210px;">
          <div class="group-popover-label" data-i18n="topmenu.boardData">Board data</div>
          <button class="popover-delete" style="color:var(--text);" id="loadSampleBtn" data-i18n="topmenu.loadSample">Load sample project</button>
          <button class="popover-delete" id="resetBoardBtn" data-i18n="topmenu.resetBoard">Reset board (clear all)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ Toolbar ============ -->
  <div class="toolbar" id="toolbarNormal">
    <div class="new-task-split">
      <button class="new-task-btn" id="newTaskBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="toolbar.newTask">New task</span>
      </button>
      <button class="new-task-caret" id="newTaskCaret" data-toast="เพิ่มลงกลุ่มอื่น: เลือกกลุ่มจากบอร์ดด้านล่างได้เลย">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <label class="search-box" id="searchBox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="search-input" id="searchInput" placeholder="Search" data-i18n-placeholder="common.search" />
    </label>

    <button class="tbar-btn" data-toast="กรองตามผู้รับผิดชอบยังไม่เปิดใช้งานในตัวอย่างนี้">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>
      <span data-i18n="toolbar.person">Person</span>
    </button>
    <button class="tbar-btn" data-toast="ตัวกรองยังไม่เปิดใช้งานในตัวอย่างนี้">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-6 8v5l-4 2v-7L4 5z"/></svg>
      <span data-i18n="toolbar.filter">Filter</span>
    </button>
    <button class="tbar-btn" data-toast="การเรียงลำดับยังไม่เปิดใช้งานในตัวอย่างนี้">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg>
      <span data-i18n="toolbar.sort">Sort</span>
    </button>
    <div style="position:relative;">
      <button class="tbar-btn" id="hideColBtn" aria-haspopup="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12s3.5-6.5 9-6.5S21 12 21 12s-3.5 6.5-9 6.5S3 12 3 12z"/><path d="M3 3l18 18"/></svg>
        <span data-i18n="toolbar.hide">Hide</span>
      </button>
      <div class="group-popover" id="hideColPopover" style="display:none; width: 170px;">
        <div class="group-popover-label" data-i18n="toolbar.hideColumns">Hide columns</div>
        <label class="hide-col-row">
          <input type="checkbox" id="hideColToggle-owner" />
          <span data-i18n="col.owner">Owner</span>
        </label>
        <label class="hide-col-row">
          <input type="checkbox" id="hideColToggle-status" />
          <span data-i18n="col.status">Status</span>
        </label>
        <label class="hide-col-row">
          <input type="checkbox" id="hideColToggle-due" />
          <span data-i18n="col.dueDate">Due date</span>
        </label>
        <label class="hide-col-row">
          <input type="checkbox" id="hideColToggle-timeline" />
          <span data-i18n="col.timeline">Timeline</span>
        </label>
        <label class="hide-col-row">
          <input type="checkbox" id="hideColToggle-priority" />
          <span data-i18n="col.priority">Priority</span>
        </label>
      </div>
    </div>
    <button class="tbar-btn" data-toast="จัดกลุ่มตามคอลัมน์อื่นยังไม่เปิดใช้งานในตัวอย่างนี้ — ตอนนี้จัดกลุ่มแบบกำหนดเองอยู่">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span data-i18n="toolbar.groupBy">Group by</span>
    </button>
    <button class="tbar-btn" data-toast="เมนูเพิ่มเติมยังไม่เปิดใช้งานในตัวอย่างนี้">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </button>

    <div class="toolbar-spacer"></div>
    <button class="collapse-all-btn" id="collapseAllBtn" title="ย่อ/ขยายทุกกลุ่ม">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <!-- ============ Project day budget ============ -->
  <div class="budget-bar" id="budgetBar">
    <span class="budget-label" data-i18n="board.totalDaysLabel">Total project days</span>
    <input type="number" id="budgetDaysInput" class="budget-input" min="0" step="1" placeholder="—" />
    <button class="budget-save-btn" id="budgetSaveBtn" disabled data-i18n="board.save">Save</button>
    <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
    <span class="budget-allocated" id="budgetAllocatedText"></span>
  </div>

  <!-- ============ Bulk bar ============ -->
  <div class="bulk-bar" id="bulkBar" style="display:none;">
    <span class="bulk-count" id="bulkCount">0 เลือกอยู่</span>
    <button class="bulk-btn" id="bulkExportBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
      <span data-i18n="bulk.export">ส่งออก</span>
    </button>
    <button class="bulk-btn danger" id="bulkDeleteBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0l-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6"/></svg>
      <span data-i18n="bulk.delete">ลบ</span>
    </button>
    <button class="bulk-cancel" id="bulkCancelBtn" data-i18n="bulk.cancel">ยกเลิก</button>
  </div>

  <!-- ============ Board ============ -->
  <div class="board" id="board"></div>
    </div>
  </div>
  <!-- /main-area -->
</div>
<!-- /shell -->

<!-- ============ Updates side panel ============ -->
<div class="panel-backdrop" id="panelBackdrop"></div>
<div class="updates-panel" id="updatesPanel" role="dialog" aria-label="Task updates">
  <div class="panel-header">
    <button class="panel-close" id="panelCloseBtn" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="panel-title" id="panelTitle"></div>
    <div class="panel-header-actions">
      <div class="avatar-circle" style="width:26px;height:26px;" data-toast="โปรไฟล์ผู้รับผิดชอบ">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </div>
      <button class="icon-square-btn" style="width:28px;height:28px;" data-toast="แชร์งานนี้ยังไม่เปิดใช้งานในตัวอย่างนี้">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 8l-5-5-5 5M12 3v12"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
      </button>
      <button class="icon-square-btn" style="width:28px;height:28px;" data-toast="เมนูเพิ่มเติมยังไม่เปิดใช้งานในตัวอย่างนี้">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>

    </div>
  </div>

  <div class="panel-tabs">
    <div class="panel-tab active" id="panelUpdatesTab">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M21 11.5a8.4 8.4 0 01-9 8.5A8.4 8.4 0 013 11.5a8.5 8.5 0 0117 0z"/></svg>
      <span id="panelUpdatesCount">Updates</span>
    </div>
    <div class="panel-tab" data-toast="Files ยังไม่เปิดใช้งานในตัวอย่างนี้" data-i18n="panel.files">Files</div>

    </div>
  </div>

  <div class="panel-body" id="panelBody"></div>

  <div class="reply-bar">
    <div class="avatar-circle" style="width:30px;height:30px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    </div>
    <input type="text" id="replyInput" placeholder="Write a reply and mention others with @" data-i18n-placeholder="panel.replyPlaceholder" />
  </div>
</div>

<!-- ============ Invite side panel ============ -->
<div class="panel-backdrop" id="inviteBackdrop"></div>
<div class="updates-panel" id="invitePanel" role="dialog" aria-label="Invite to this project">
  <div class="panel-header">
    <button class="panel-close" id="inviteCloseBtn" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>

    <div class="panel-title" data-i18n="tb.invitePanelTitle">Invite to this project</div>
  </div>
  <div class="panel-body" id="inviteBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="shared/shared.js"></script>
<script>
(function () {
  "use strict";
  var PM = window.PM;

  // ---------------- board-local UI state (mirrors the original SPA's module vars) ----------------
  var searchQuery = "";
  var selected = new Set(); // "task:ID" or "sub:PARENTID:ID"
  var openPopoverGroup = null;
  var openDateRangePopover = null; // task id
  var dateRangeDraft = null; // { start, due } while the popover is open
  var dateRangeViewYear = null;
  var dateRangeViewMonth = null; // 0-indexed
  var activePanelTaskId = null;

  function findTask(id) { return PM.findTask(id); }
  function findGroup(id) { return PM.findGroup(id); }
  function findSub(taskId, subId) { return PM.findSub(taskId, subId); }
  function tr(key) { return PM.tr(key); }
  function esc(s) { return PM.esc(s); }
  function statusLabel(k) { return PM.statusLabel(k); }
  function priorityLabel(k) { return PM.priorityLabel(k); }
  function fmtDate(s) { return PM.fmtDate(s); }
  function fmtRangeEnd(a, b) { return PM.fmtRangeEnd(a, b); }
  function fmtDuration(a, b) { return PM.fmtDuration(a, b); }
  function overdueDays(due, status) { return PM.overdueDays(due, status); }
  function overdueLabel(n) { return PM.overdueLabel(n); }
  function overdueShort(n) { return PM.overdueShort(n); }
  function todayIso() { return PM.todayIso(); }
  function isoToMDY(s) { return PM.isoToMDY(s); }
  function mdyToIso(s) { return PM.mdyToIso(s); }
  function daysBetweenInclusive(a, b) { return PM.daysBetweenInclusive(a, b); }
  function avatarColor(n) { return PM.avatarColor(n); }
  function initials(n) { return PM.initials(n); }
  function uid() { return PM.uid(); }
  function showToast(msg) { PM.showToast(msg); }
  function persist() { PM.persist(); }
  function taskDurationDays(t) { return PM.taskDurationDays(t); }
  function allocatedDaysTotal() { return PM.allocatedDaysTotal(); }
  function lang() { return PM.lang; }

  function taskMatchesSearch(t) {
    if (!searchQuery) return true;
    var q = searchQuery.toLowerCase();
    if ((t.name || "").toLowerCase().indexOf(q) !== -1) return true;
    if ((t.owner || "").toLowerCase().indexOf(q) !== -1) return true;
    return t.subitems.some(function (s) {
      return (s.name || "").toLowerCase().indexOf(q) !== -1 || (s.owner || "").toLowerCase().indexOf(q) !== -1;
    });
  }

  // ---------------- render ----------------

  function render() {
    renderBoard();
    renderBulkBar();
    renderPanel();
    PM.syncSidebarLinks();
    PM.renderSidebarProgress();
    renderBudgetSummary();
  }

  function renderBoard() {
    var board = document.getElementById("board");
    if (!PM.state.groups.length) {
      board.innerHTML = '<div class="empty-board">' + (PM.lang === "th"
        ? 'ยังไม่มีกลุ่มงาน — คลิก <strong>' + tr("toolbar.newTask") + '</strong> หรือเพิ่มกลุ่มเพื่อเริ่มต้น'
        : 'No groups yet — click <strong>New task</strong> or add a group to get started.') + '</div>';
      return;
    }
    board.innerHTML = PM.state.groups.map(renderGroup).join("");
  }

  function colHeaders() {
    return '<div class="row-grid col-headers">' +
      '<div></div><div></div><div>' + tr("col.task") + '</div><div></div><div class="col-owner">' + tr("col.owner") + '</div>' +
      '<div class="col-status">' + tr("col.status") + '</div><div class="col-due">' + tr("col.dueDate") + '</div><div class="col-timeline">' + tr("col.timeline") + '</div>' +
      '<div class="col-priority">' + tr("col.priority") + '</div></div>';
  }

  function renderGroup(g) {
    var allTasks = PM.state.tasks.filter(function (t) { return t.groupId === g.id; });
    var tasks = allTasks.filter(taskMatchesSearch);
    if (searchQuery && tasks.length === 0) return "";

    var swatches = PM.GROUP_COLORS.map(function (c) {
      return '<button class="color-dot' + (c === g.color ? ' active' : '') + '" style="background:' + c + '" ' +
        'data-action="set-color" data-group="' + g.id + '" data-color="' + c + '" aria-label="เปลี่ยนสีกลุ่ม"></button>';
    }).join("");

    var popoverOpen = openPopoverGroup === g.id;
    var popover = popoverOpen ? (
      '<div class="group-popover" data-stop="1">' +
        '<div class="group-popover-label">' + (PM.lang === "th" ? "สีของกลุ่ม" : "Group color") + '</div>' +
        '<div class="swatch-row">' + swatches + '</div>' +
        '<button class="popover-delete" data-action="delete-group" data-group="' + g.id + '">' + (PM.lang === "th" ? "ลบกลุ่ม" : "Delete group") + '</button>' +
      '</div>'
    ) : "";

    var rows = tasks.map(function (t) { return renderTaskBlock(t); }).join("");

    return '<div class="group' + (g.collapsed ? ' collapsed' : '') + '" data-group="' + g.id + '">' +
      '<div class="group-head" style="color:' + g.color + '">' +
        '<button class="group-collapse" data-action="toggle-collapse" data-group="' + g.id + '" aria-label="ย่อ/ขยายกลุ่ม">' +
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>' +
        '</button>' +
        '<input class="group-name" style="color:' + g.color + '" data-action="rename-group" data-group="' + g.id + '" value="' + esc(g.name) + '" />' +
        '<span class="group-count">' + allTasks.length + '</span>' +
        '<div class="group-kebab-wrap' + (popoverOpen ? ' open' : '') + '">' +
          '<button class="group-kebab" data-action="toggle-popover" data-group="' + g.id + '" aria-label="ตัวเลือกกลุ่ม">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>' +
          '</button>' + popover +
        '</div>' +
      '</div>' +
      '<div class="table-wrap">' +
        (tasks.length ? colHeaders() : '') +
        rows +
        '<div class="add-task-row"><div class="add-link-row" data-action="add-task" data-group="' + g.id + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>' +
          tr("board.addTask") + '</div></div>' +
      '</div>' +
    '</div>';
  }

  function renderTaskBlock(t) {
    var hasSub = t.subitems.length > 0;
    var open = !!t.subitemsOpen;
    var checked = selected.has("task:" + t.id);
    var taskOverdue = overdueDays(t.due, t.status);

    var ownerHtml = t.owner
      ? '<button class="owner-avatar" style="background:' + avatarColor(t.owner) + '" data-action="edit-owner" data-task="' + t.id + '" title="' + esc(t.owner) + '">' + esc(initials(t.owner)) + '</button>'
      : '<button class="owner-avatar empty" data-action="edit-owner" data-task="' + t.id + '" title="' + tr("board.assignOwner") + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>';

    var statusOpts = PM.STATUS_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === t.status ? ' selected' : '') + '>' + statusLabel(k) + '</option>';
    }).join("");
    var priOpts = PM.PRIORITY_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === t.priority ? ' selected' : '') + '>' + priorityLabel(k) + '</option>';
    }).join("");

    var timelineActive = t.status === "working";
    var updateCount = (t.updates || []).length;
    var bubbleHtml = '<button class="update-bubble-btn' + (updateCount ? ' has-updates' : '') + '" data-action="open-panel" data-task="' + t.id + '" title="Updates" aria-label="เปิดอัปเดตงาน">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="' + (updateCount ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 01-9 8.5A8.4 8.4 0 013 11.5a8.5 8.5 0 0117 0z"/></svg>' +
      (updateCount ? updateCount : '') +
    '</button>';

    var row = '<div class="row-grid task-row' + (activePanelTaskId === t.id ? ' panel-open' : '') + '" data-task="' + t.id + '">' +
      '<div class="cell row-checkbox"><input type="checkbox" data-action="select" data-key="task:' + t.id + '"' + (checked ? ' checked' : '') + ' aria-label="เลือกงาน" /></div>' +
      '<div class="cell"><button class="expand-toggle' + (open ? ' open' : '') + (hasSub ? '' : ' no-sub') + '" data-action="toggle-sub" data-task="' + t.id + '" aria-label="ขยายงานย่อย">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button></div>' +
      '<div class="cell task-name-cell">' +
        '<input type="text" class="task-name-input" data-field="name" data-task="' + t.id + '" value="' + esc(t.name) + '" placeholder="' + tr("board.taskPlaceholder") + '" />' +
        (hasSub ? '<span class="sub-badge" data-action="toggle-sub" data-task="' + t.id + '">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>' +
          t.subitems.length + '</span>' : '') +
      '</div>' +
      '<div class="cell">' + bubbleHtml + '</div>' +
      '<div class="cell col-owner">' + ownerHtml + '</div>' +
      '<div class="cell col-status"><span class="status-wrap">' +
        '<select class="pill status-' + t.status + '" data-field="status" data-task="' + t.id + '">' + statusOpts + '</select>' +
        (taskOverdue ? '<span class="overdue-dot" title="' + esc(overdueLabel(taskOverdue)) + '">' + taskOverdue + '</span>' : '') +
      '</span></div>' +
      '<div class="cell due-cell col-due">' + dueIcon(t.status) +
        '<span class="date-field">' +
          '<input type="date" data-field="due" data-task="' + t.id + '" value="' + esc(t.due || '') + '" />' +
          '<span class="date-display' + (t.due ? '' : ' is-empty') + (taskOverdue ? ' is-overdue' : '') + '">' + esc(t.due ? fmtDate(t.due) : '–') + '</span>' +
        '</span>' +
        (taskOverdue ? '<span class="overdue-tag" title="' + esc(overdueLabel(taskOverdue)) + '">' + esc(overdueShort(taskOverdue)) + '</span>' : '') +
      '</div>' +
      '<div class="cell col-timeline"><div class="timeline-wrap">' +
        '<button type="button" class="timeline-pill' + (timelineActive ? ' active' : '') + '" data-action="toggle-date-popover" data-task="' + t.id + '">' +
          (t.start || t.due
            ? '<span class="tl-date">' + esc(t.start ? fmtDate(t.start) : '–') + '</span>' +
              '<span class="timeline-sep">–</span>' +
              '<span class="tl-date">' + esc(t.due ? fmtRangeEnd(t.start, t.due) : '–') + '</span>' +
              '<span class="timeline-duration">' + esc(fmtDuration(t.start, t.due)) + '</span>'
            : '<span class="tl-empty">' + tr("board.setDates") + '</span>') +
        '</button>' +
        (openDateRangePopover === t.id ? renderDateRangePopover(t) : '') +
      '</div></div>' +
      '<div class="cell col-priority"><select class="pill pri-' + t.priority + '" data-field="priority" data-task="' + t.id + '">' + priOpts + '</select></div>' +
    '</div>';

    var subPanel = "";
    if (open) {
      var subRows = t.subitems.map(function (s) { return renderSubRow(t.id, s); }).join("");
      subPanel = '<div class="subitem-panel">' +
        '<div class="sub-row-grid sub-col-headers"><div></div><div>' + tr("col.subitem") + '</div><div class="col-owner">' + tr("col.owner") + '</div><div class="col-status">' + tr("col.status") + '</div><div class="col-due">' + tr("col.date") + '</div></div>' +
        subRows +
        '<div class="add-link-row" data-action="add-sub" data-task="' + t.id + '">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>' + tr("board.addSubitem") + '</div>' +
      '</div>';
    }

    return '<div class="task-block">' + row + subPanel + '</div>';
  }

  function renderSubRow(taskId, s) {
    var checked = selected.has("sub:" + taskId + ":" + s.id);
    var ownerHtml = s.owner
      ? '<button class="owner-avatar" style="background:' + avatarColor(s.owner) + '" data-action="edit-sub-owner" data-task="' + taskId + '" data-sub="' + s.id + '" title="' + esc(s.owner) + '">' + esc(initials(s.owner)) + '</button>'
      : '<button class="owner-avatar empty" data-action="edit-sub-owner" data-task="' + taskId + '" data-sub="' + s.id + '" title="' + tr("board.assignOwner") + '">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>';
    var statusOpts = PM.STATUS_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === s.status ? ' selected' : '') + '>' + statusLabel(k) + '</option>';
    }).join("");
    var subOverdue = overdueDays(s.date, s.status);

    return '<div class="sub-row-grid subitem-row" data-sub="' + s.id + '">' +
      '<div class="cell row-checkbox"><input type="checkbox" data-action="select" data-key="sub:' + taskId + ':' + s.id + '"' + (checked ? ' checked' : '') + ' aria-label="เลือกงานย่อย" /></div>' +
      '<div class="cell"><input type="text" class="task-name-input" data-field="sub-name" data-task="' + taskId + '" data-sub="' + s.id + '" value="' + esc(s.name) + '" placeholder="' + tr("board.subitemPlaceholder") + '" /></div>' +
      '<div class="cell col-owner">' + ownerHtml + '</div>' +
      '<div class="cell col-status"><span class="status-wrap">' +
        '<select class="pill status-' + s.status + '" data-field="sub-status" data-task="' + taskId + '" data-sub="' + s.id + '">' + statusOpts + '</select>' +
        (subOverdue ? '<span class="overdue-dot" title="' + esc(overdueLabel(subOverdue)) + '">' + subOverdue + '</span>' : '') +
      '</span></div>' +
      '<div class="cell due-cell col-due"><span class="date-field">' +
        '<input type="date" data-field="sub-date" data-task="' + taskId + '" data-sub="' + s.id + '" value="' + esc(s.date || '') + '" />' +
        '<span class="date-display' + (s.date ? '' : ' is-empty') + (subOverdue ? ' is-overdue' : '') + '">' + esc(s.date ? fmtDate(s.date) : '–') + '</span>' +
      '</span>' +
      (subOverdue ? '<span class="overdue-tag" title="' + esc(overdueLabel(subOverdue)) + '">' + esc(overdueShort(subOverdue)) + '</span>' : '') +
      '</div>' +
    '</div>';
  }

  function dueIcon(status) {
    if (status === "done") {
      return '<svg class="due-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#299d90" stroke-width="3"><title>' + esc(statusLabel("done")) + '</title><path d="M4 12l5 5L20 6"/></svg>';
    }
    if (status === "working") {
      return '<svg class="due-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f3a261" stroke-width="2.4"><title>' + esc(statusLabel("working")) + '</title><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>';
    }
    if (status === "stuck") {
      return '<svg class="due-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9699a6" stroke-width="2.2"><title>' + esc(statusLabel("stuck")) + '</title><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    }
    return '<span class="due-icon" style="width:14px;"></span>';
  }

  function renderDateRangePopover(t) {
    var draft = dateRangeDraft || { start: "", due: "" };
    var count = draft.due ? daysBetweenInclusive(draft.start, draft.due) : (draft.start ? 1 : 0);
    var countLabel = count ? (count + " " + tr("board.daysSelected")) : "";

    var y = dateRangeViewYear, m = dateRangeViewMonth;
    var firstOfMonth = new Date(y, m, 1);
    var startWeekday = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrevMonth = new Date(y, m, 0).getDate();
    var today = todayIso();

    var cells = [];
    for (var i = 0; i < startWeekday; i++) {
      var pd = daysInPrevMonth - startWeekday + 1 + i;
      cells.push({ day: pd, outside: true, iso: null });
    }
    for (var d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, outside: false, iso: y + "-" + PM.pad2(m + 1) + "-" + PM.pad2(d) });
    }
    while (cells.length % 7 !== 0) {
      var nd = cells.length - (startWeekday + daysInMonth) + 1;
      cells.push({ day: nd, outside: true, iso: null });
    }

    var dayCellsHtml = cells.map(function (c) {
      if (c.outside) return '<span class="drp-day drp-outside">' + c.day + '</span>';
      var classes = "drp-day";
      if (c.iso === today) classes += " drp-today";
      if (draft.start && c.iso === draft.start) classes += " drp-range-start";
      if (draft.due && c.iso === draft.due) classes += " drp-range-end";
      if (draft.start && draft.due && c.iso > draft.start && c.iso < draft.due) classes += " drp-in-range";
      return '<button type="button" class="' + classes + '" data-action="pick-date-cell" data-task="' + t.id + '" data-date="' + c.iso + '">' + c.day + '</button>';
    }).join("");

    var weekdayHtml = PM.WEEKDAY_LABELS.map(function (w) { return '<span class="drp-weekday">' + w + '</span>'; }).join("");

    return '<div class="date-range-popover" data-stop="1">' +
      '<div class="drp-header">' +
        '<span class="drp-title">' + tr("board.setDates") + '</span>' +
        '<span class="drp-count">' + countLabel + '</span>' +
      '</div>' +
      '<div class="drp-inputs">' +
        '<input type="text" placeholder="MM/DD/YYYY" data-field="range-start" data-task="' + t.id + '" value="' + esc(isoToMDY(draft.start)) + '" />' +
        '<span class="timeline-sep">–</span>' +
        '<input type="text" placeholder="MM/DD/YYYY" data-field="range-due" data-task="' + t.id + '" value="' + esc(isoToMDY(draft.due)) + '" />' +
      '</div>' +
      '<div class="drp-nav">' +
        '<button type="button" class="drp-nav-btn" data-action="date-popover-prev-month" data-task="' + t.id + '" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M15 6l-6 6 6 6"/></svg></button>' +
        '<span class="drp-nav-label">' + PM.MONTH_NAMES[m].slice(0, 3) + " " + y + '</span>' +
        '<button type="button" class="drp-nav-btn" data-action="date-popover-next-month" data-task="' + t.id + '" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M9 6l6 6-6 6"/></svg></button>' +
      '</div>' +
      '<div class="drp-grid">' + weekdayHtml + dayCellsHtml + '</div>' +
    '</div>';
  }

  function syncTimelineButton(taskId) {
    var t = findTask(taskId);
    if (!t) return;
    var row = document.querySelector('.task-row[data-task="' + taskId + '"]');
    var btn = row && row.querySelector(".timeline-pill");
    if (!btn) return;
    var hasDates = !!(t.start || t.due);
    var currentlyEmpty = !!btn.querySelector(".tl-empty");
    if (hasDates === currentlyEmpty) { render(); return; } // placeholder <-> filled is a structural change
    if (!hasDates) return;
    var dateSpans = btn.querySelectorAll(".tl-date");
    if (dateSpans[0]) dateSpans[0].textContent = t.start ? fmtDate(t.start) : "–";
    if (dateSpans[1]) dateSpans[1].textContent = t.due ? fmtRangeEnd(t.start, t.due) : "–";
    var durEl = btn.querySelector(".timeline-duration");
    if (durEl) durEl.textContent = fmtDuration(t.start, t.due);
  }

  function renderBulkBar() {
    var bar = document.getElementById("bulkBar");
    var count = selected.size;
    if (count === 0) { bar.style.display = "none"; return; }
    bar.style.display = "flex";
    document.getElementById("bulkCount").textContent = count + " " + (count === 1 ? tr("bulk.itemSelected") : tr("bulk.itemsSelected"));
  }

  // ---------------- project day budget ----------------

  function syncBudgetInput() {
    var el = document.getElementById("budgetDaysInput");
    if (el) el.value = PM.state.totalDaysBudget || "";
    updateBudgetSaveBtnState();
  }
  function budgetInputDraftValue() {
    var el = document.getElementById("budgetDaysInput");
    if (!el) return PM.state.totalDaysBudget || null;
    var v = el.value.trim();
    return v === "" ? null : Math.max(0, parseInt(v, 10) || 0);
  }
  function updateBudgetSaveBtnState() {
    var btn = document.getElementById("budgetSaveBtn");
    if (!btn) return;
    btn.disabled = budgetInputDraftValue() === (PM.state.totalDaysBudget || null);
  }
  function renderBudgetSummary(previewBudget) {
    var fillEl = document.getElementById("budgetFill");
    var textEl = document.getElementById("budgetAllocatedText");
    if (!fillEl || !textEl) return;
    var budget = previewBudget !== undefined ? previewBudget : PM.state.totalDaysBudget;
    var used = allocatedDaysTotal();
    if (!budget) {
      fillEl.style.width = "0%";
      fillEl.classList.remove("over");
      textEl.classList.remove("over");
      textEl.textContent = tr("board.allocatedDays").replace("{used}", used).replace("{total}", "—");
      return;
    }
    var over = used > budget;
    fillEl.style.width = Math.min(100, Math.round((used / budget) * 100)) + "%";
    fillEl.classList.toggle("over", over);
    textEl.classList.toggle("over", over);
    var label = tr("board.allocatedDays").replace("{used}", used).replace("{total}", budget);
    if (over) {
      var n = used - budget;
      label += " · " + tr("board.allocatedOverBy").replace("{n}", n).replace("{s}", n === 1 ? "" : "s");
    }
    textEl.textContent = label;
  }
  function checkBudgetWarning() {
    var budget = PM.state.totalDaysBudget;
    if (!budget) return;
    var used = allocatedDaysTotal();
    if (used > budget) {
      var n = used - budget;
      showToast(tr("board.budgetWarnToast").replace("{used}", used).replace("{total}", budget)
        .replace("{n}", n).replace("{s}", n === 1 ? "" : "s"));
    }
  }
  function commitBudgetDays() {
    PM.state.totalDaysBudget = budgetInputDraftValue();
    persist();
    updateBudgetSaveBtnState();
    renderBudgetSummary();
    var budget = PM.state.totalDaysBudget;
    if (budget && allocatedDaysTotal() > budget) {
      checkBudgetWarning();
    } else {
      showToast(tr("board.budgetSaved"));
    }
  }

  // ---------------- updates panel ----------------

  function openPanel(taskId) {
    activePanelTaskId = taskId;
    render();
  }
  function closePanel() {
    activePanelTaskId = null;
    renderBoard();
    renderPanel();
  }
  function renderPanel() {
    var panel = document.getElementById("updatesPanel");
    var backdrop = document.getElementById("panelBackdrop");
    var task = activePanelTaskId ? findTask(activePanelTaskId) : null;

    if (!task) {
      panel.classList.remove("open");
      backdrop.classList.remove("open");
      return;
    }

    panel.classList.add("open");
    backdrop.classList.add("open");
    document.getElementById("panelTitle").textContent = task.name || "(untitled task)";
    var updates = task.updates || [];
    document.getElementById("panelUpdatesCount").textContent = tr("panel.updates") + (updates.length ? " / " + updates.length : "");

    var listHtml = updates.length
      ? updates.map(function (u) { return renderUpdateItem(task.id, u); }).join("")
      : '<div class="no-updates">' + tr("panel.noUpdates") + '</div>';

    document.getElementById("panelBody").innerHTML =
      '<div class="panel-links-row">' +
        '<button data-toast="Update via email ยังไม่เปิดใช้งานในตัวอย่างนี้">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>' +
          tr("panel.updateViaEmail") + '</button>' +
        '<span class="panel-links-sep">|</span>' +
        '<button data-toast="ขอบคุณสำหรับความสนใจ — ฟีเจอร์นี้ยังไม่เปิดใช้งานในตัวอย่างนี้">' + tr("panel.giveFeedback") + '</button>' +
      '</div>' +
      '<div class="compose-box">' +
        '<textarea id="composeInput" placeholder="' + tr("panel.composePlaceholder") + '"></textarea>' +
        '<div class="compose-toolbar">' +

  async function doExport(data) {
    var json = JSON.stringify(data, null, 2);
    var rawTitle = (PM.state.title || "it-project-board").trim();
    var filename = (rawTitle.replace(/[\\/:*?"<>|]+/g, "_").replace(/\s+/g, "_") || "it-project-board").slice(0, 60) + ".json";
    if (window.claude && window.claude.downloads) {
      try {
        await window.claude.downloads.save({ filename: filename, data: json });
        showToast("Saved " + filename);
      } catch (err) {
        showToast(err && err.code === "declined" ? "Save cancelled" : "Couldn't save the file right now");
      }

        dateRangeViewMonth = baseD.getMonth();

      dateRangeViewMonth--;

    if (action === "date-popover-next-month") {

      var pickIso = el.dataset.date;
      if (!dateRangeDraft.start || (dateRangeDraft.start && dateRangeDraft.due)) {
        dateRangeDraft.start = pickIso;
        dateRangeDraft.due = "";
      } else if (pickIso < dateRangeDraft.start) {
        dateRangeDraft.start = pickIso;
        dateRangeDraft.due = "";
      } else {
        dateRangeDraft.due = pickIso;
      }
      var pickTask = findTask(el.dataset.task);

        pickTask.start = dateRangeDraft.start;
        pickTask.due = dateRangeDraft.due;
        persist();

    if (!field) return;

    if (field === "rename-group") { findGroup(el.dataset.group).name = el.value; persist(); return; }
    if (field === "range-start" || field === "range-due") return; // committed on change (blur/Enter), not per keystroke

    var taskId = el.dataset.task;
    var t = findTask(taskId);
    if (!t) return;

    if (field === "sub-name" || field === "sub-status" || field === "sub-date") {
      var s = findSub(taskId, el.dataset.sub);
      if (!s) return;
      if (field === "sub-name") s.name = el.value;
      if (field === "sub-status") { s.status = el.value; el.className = "pill status-" + el.value; }
      if (field === "sub-date") {
        s.date = el.value;
        var subDisp = el.nextElementSibling;
        if (subDisp) { subDisp.textContent = s.date ? fmtDate(s.date) : "–"; subDisp.classList.toggle("is-empty", !s.date); }
      }
      persist();
      return;
    }

    if (field === "name") t.name = el.value;
    if (field === "due") {
      t.due = el.value;
      var dueDisp = el.nextElementSibling;
      if (dueDisp) { dueDisp.textContent = t.due ? fmtDate(t.due) : "–"; dueDisp.classList.toggle("is-empty", !t.due); }
      syncTimelineButton(taskId);

    if (field === "status") {
      t.status = el.value;

      persist(); render();

  function inviteMatchesSearch(u) {
    if (!inviteSearchQuery) return true;

  function groupInviteUsersByDepartment(list) {
    var groups = [];
    list.forEach(function (u) {
      var name = (u.department || "").trim();
      var key = name || INVITE_UNASSIGNED_KEY;
      var group = groups.find(function (g) { return g.key === key; });
      if (!group) { group = { key: key, name: name, items: [] }; groups.push(group); }
      group.items.push(u);
    });
    groups.sort(function (a, b) {
      if (a.key === INVITE_UNASSIGNED_KEY) return 1;
      if (b.key === INVITE_UNASSIGNED_KEY) return -1;
      return a.name.localeCompare(b.name, "th");

    return '<div class="member-group' + (collapsed ? ' collapsed' : '') + '" data-dept="' + esc(g.key) + '">' +
      '<div class="member-group-head" data-action="toggle-invite-dept" data-dept="' + esc(g.key) + '">' +
        '<svg class="member-group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>' +
        '<span class="member-group-name">' + esc(label) + '</span>' +
        '<span class="member-group-count">' + g.items.length + '</span>' +
      '</div>' +
      '<div class="member-group-items">' + visibleItems.map(renderInviteRow).join("") + '</div>' +
    '</div>';
  }

  function renderInviteBody() {
    var body = document.getElementById("inviteBody");
    if (!inviteAllUsers) {
      body.innerHTML = '<div class="no-updates">' + esc(tr("users.loadError")) + '</div>';
      return;
    }
    var groups = groupInviteUsersByDepartment(inviteAllUsers);
    var groupsHtml = groups.map(renderInviteGroup).join("") || '<div class="no-updates">' + esc(tr("users.noUsers")) + '</div>';

    body.innerHTML =
      '<p class="muted" style="margin:0 0 12px;font-size:12.5px;">' + esc(tr("tb.inviteHint")) + '</p>' +
      '<label class="search-box" id="inviteSearchBox" style="margin-bottom:12px;">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
        '<input class="search-input" id="inviteSearchInput" placeholder="' + esc(tr("common.search")) + '" value="' + esc(inviteSearchQuery) + '" style="width:100%;" />' +
      '</label>' +
      groupsHtml;

    var searchInput = document.getElementById("inviteSearchInput");
    searchInput.addEventListener("input", function (e) { inviteSearchQuery = e.target.value; renderInviteBody(); });
    // Re-focus + restore cursor position after the re-render above wipes it.
    searchInput.focus();
    var pos = searchInput.value.length;
    searchInput.setSelectionRange(pos, pos);

    body.querySelectorAll('[data-action="toggle-invite-dept"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var key = el.dataset.dept;
        if (collapsedInviteDepts.has(key)) collapsedInviteDepts.delete(key); else collapsedInviteDepts.add(key);
        renderInviteBody();
      });
    });
    body.querySelectorAll('[data-action="toggle-invite"]').forEach(function (el) {
      el.addEventListener("click", function () { handleToggleInvite(el.dataset.user); });
    });
  }

  function handleToggleInvite(userId) {
    if (!PM.currentProjectId) return;
    var isMember = projectMemberIds.has(userId);
    var request = isMember
      ? PM.removeProjectMember(PM.currentProjectId, userId)
      : PM.addProjectMember(PM.currentProjectId, userId);
    request.then(function () {
      if (isMember) projectMemberIds.delete(userId); else projectMemberIds.add(userId);
      updateInviteCountBadge();
      renderInviteBody();
      showToast(isMember ? tr("tb.inviteRemoved") : tr("tb.inviteAdded"));
    }).catch(function () { showToast(tr("tb.inviteError")); });
  }

  function openInvitePanel() {
    document.getElementById("invitePanel").classList.add("open");
    document.getElementById("inviteBackdrop").classList.add("open");
    if (!PM.currentProjectId) {
      document.getElementById("inviteBody").innerHTML = '<div class="no-updates">' + esc(tr("tb.inviteError")) + '</div>';
      return;
    }
    if (inviteAllUsers) {
      renderInviteBody();
    } else {
      document.getElementById("inviteBody").innerHTML = '<div class="no-updates">' + esc(tr("users.loadError")) + '</div>';
      Promise.all([PM.loadUsers(), PM.loadProjectMembers(PM.currentProjectId)]).then(function (results) {
        inviteAllUsers = results[0];
        projectMemberIds = new Set(results[1].map(function (u) { return u.id; }));
        updateInviteCountBadge();
        renderInviteBody();
      }).catch(function () {
        document.getElementById("inviteBody").innerHTML = '<div class="no-updates">' + esc(tr("users.loadError")) + '</div>';
      });
    }
  }

  function closeInvitePanel() {
    document.getElementById("invitePanel").classList.remove("open");
    document.getElementById("inviteBackdrop").classList.remove("open");
  }

  document.getElementById("inviteBtn").addEventListener("click", openInvitePanel);
  document.getElementById("inviteCloseBtn").addEventListener("click", closeInvitePanel);
  document.getElementById("inviteBackdrop").addEventListener("click", closeInvitePanel);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("invitePanel").classList.contains("open")) closeInvitePanel();
  });

  // Load the project's member count on page load too, so the "Invite · N"
  // badge is accurate even before the panel is ever opened.
  function loadInviteCountOnly() {
    if (!PM.currentProjectId) return;
    PM.loadProjectMembers(PM.currentProjectId).then(function (list) {
      projectMemberIds = new Set(list.map(function (u) { return u.id; }));
      updateInviteCountBadge();
    }).catch(function () {});
  }

  // ---------------- init ----------------
  // Gated: nothing else runs until the session is confirmed valid server-side.

  PM.requireAuth().then(function () {
    PM.resolveProjectId();
    PM.state = PM.loadCachedState() || PM.seedState();
    document.getElementById("boardTitle").value = PM.state.title || ""; syncBudgetInput();
    applyColumnVisibility();
    PM.initSidebar("board", render);
    render();

    if (PM.currentProjectId) {
      loadInviteCountOnly();
      PM.fetchProjectState(PM.currentProjectId).then(function (data) {
        PM.state = data;
        document.getElementById("boardTitle").value = PM.state.title || ""; syncBudgetInput();
        render();
        PM.loadProjectList();
      }).catch(function () {
        showToast("Offline — using local data (API unreachable)");
      });
    } else {
      // No project id anywhere yet (first-ever visit) — try the legacy
      // single-project endpoint so an existing server-side project still loads.
      PM.fetchProjectState(null).then(function (data) {
        PM.state = data;
        if (data.id) {
          PM.currentProjectId = data.id;
          try { localStorage.setItem(PM.CURRENT_PROJECT_KEY, data.id); } catch (e) {}
        }
        document.getElementById("boardTitle").value = PM.state.title || ""; syncBudgetInput();
        render();
        PM.loadProjectList();
        loadInviteCountOnly();
      }).catch(function () {
        showToast("Offline — using local data (API unreachable)");
      });
    }
  }).catch(function () {}); // requireAuth already redirected to login.html
})();
</script>
