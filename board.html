  var ownerPickerQuery = "";
  var ownerPickerOutsideHandler = null;

  function closeOwnerPicker() {
    var el = document.getElementById("ownerPickerPopover");
    if (el) el.remove();
    ownerPickerQuery = "";
    if (ownerPickerOutsideHandler) {
      document.removeEventListener("mousedown", ownerPickerOutsideHandler, true);
      ownerPickerOutsideHandler = null;
    }
  }

  function renderOwnerPickerList(pop, item) {
    var q = ownerPickerQuery.toLowerCase();
    var members = projectMembersFull.filter(function (u) { return !q || u.name.toLowerCase().indexOf(q) !== -1; });
    var listHtml = '<button class="owner-picker-row owner-picker-clear" data-owner-name="">' + esc(tr("board.unassigned")) + '</button>' +
      members.map(function (u) {
        var active = item.owner === u.name;
        return '<button class="owner-picker-row' + (active ? ' active' : '') + '" data-owner-name="' + esc(u.name) + '">' +
          '<span class="owner-avatar" style="width:22px;height:22px;font-size:10px;background:' + PM.avatarColor(u.name) + '">' + esc(PM.initials(u.name)) + '</span>' +
          '<span>' + esc(u.name) + '</span>' +
        '</button>';
      }).join("") || '<div class="owner-picker-empty">' + esc(tr("ws.noAssetsMatch")) + '</div>';

    var searchHtml = '<div class="owner-picker-search"><input type="text" id="ownerPickerSearch" placeholder="' + esc(tr("common.search")) + '" value="' + esc(ownerPickerQuery) + '" /></div>';
    pop.innerHTML = '<div class="group-popover-label">' + esc(tr("board.assignOwner")) + '</div>' + searchHtml + listHtml;

    var searchInput = document.getElementById("ownerPickerSearch");
    searchInput.addEventListener("input", function (e) { ownerPickerQuery = e.target.value; renderOwnerPickerList(pop, item); });
    searchInput.addEventListener("keydown", function (e) { e.stopPropagation(); });
    searchInput.focus();
    var pos = searchInput.value.length;
    searchInput.setSelectionRange(pos, pos);

    pop.querySelectorAll("[data-owner-name]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        item.owner = btn.dataset.ownerName;
        persist(); render();
        closeOwnerPicker();
      });
    });
  }

  function openOwnerPicker(anchorEl, item) {
    closeOwnerPicker();
    ownerPickerQuery = "";
    var rect = anchorEl.getBoundingClientRect();
    var pop = document.createElement("div");
    pop.className = "group-popover owner-picker-popover";
    pop.id = "ownerPickerPopover";
    pop.style.position = "fixed";
    pop.style.width = "210px";
    pop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 226)) + "px";
    pop.style.top = Math.min(rect.bottom + 6, window.innerHeight - 260) + "px";
    // Also opened from the Updates panel's own owner avatar (panelOwnerBtn)
    // — .updates-panel sits at z-index:91, so this body-level popover needs
    // to explicitly out-rank it or the panel would render on top and hide it.
    pop.style.zIndex = "95";
    document.body.appendChild(pop);

    if (!PM.currentProjectId) {
      pop.innerHTML = '<div class="owner-picker-empty">' + esc(tr("tb.inviteError")) + '</div>';
    } else if (projectMembersFull.length) {
      renderOwnerPickerList(pop, item);
    } else {
      pop.innerHTML = '<div class="owner-picker-empty">' + esc(tr("board.noProjectMembers")) + '</div>';
      loadInviteCountOnly().then(function () {
        if (document.getElementById("ownerPickerPopover") === pop) {
          if (projectMembersFull.length) renderOwnerPickerList(pop, item);
          else pop.innerHTML = '<div class="owner-picker-empty">' + esc(tr("board.noProjectMembers")) + '</div>';
        }
      });
    }

    ownerPickerOutsideHandler = function (e) {
      if (!pop.contains(e.target)) closeOwnerPicker();
    };
    setTimeout(function () { document.addEventListener("mousedown", ownerPickerOutsideHandler, true); }, 0);
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("ownerPickerPopover")) closeOwnerPicker();
  });

  // ---------------- folder picker (subitems only) ----------------
  // A task's own folder is always its own name (see renderRow) — not
  // user-editable. Subitems are what actually get a free-form folder: the
  // picker here lets you nest a subitem under the parent task's name using
  // any path you like, picking from paths already used by that task's OTHER
  // subitems or creating a new one on the spot. The stored value on each
  // subitem is *relative* to its parent task (e.g. "Configs", not
  // "Task Name/Configs") so it keeps working correctly if the task is
  // later renamed — the full displayed path is always computed as
  // parentTask.name + "/" + subitem.folder.
  var folderPickerQuery = "";
  var folderTreeExpanded = new Set(); // node paths currently expanded (relative to the task)
  var folderTreeCreateUnder = ""; // "" = directly under the task; a node's "+" narrows it further
  var folderPickerOutsideHandler = null;
  var folderPickerTask = null; // the parent task the open picker is scoped to

  function closeFolderPicker() {
    var el = document.getElementById("folderPickerPopover");
    if (el) el.remove();
    folderPickerQuery = "";
    folderTreeExpanded = new Set();
    folderTreeCreateUnder = "";
    folderPickerTask = null;
    if (folderPickerOutsideHandler) {
      document.removeEventListener("mousedown", folderPickerOutsideHandler, true);
      folderPickerOutsideHandler = null;
    }
  }

  // Distinct relative folder paths already used by OTHER subitems of the
  // same parent task — the suggestion source for that task's picker.
  function distinctSubfolders(task) {
    var set = new Set();
    (task.subitems || []).forEach(function (s) { if (s.folder) set.add(s.folder); });
    return Array.from(set).sort(function (a, b) { return a.localeCompare(b, "th"); });
  }

  // Immediate child folder names directly under parentPath (""=root),
  // inferred from every distinct relative path — so a folder like
  // "Configs/2024" implies "Configs" has a child "2024" even if no subitem
  // is tagged with "Configs" alone.
  function folderChildren(paths, parentPath) {
    var prefix = parentPath ? parentPath + "/" : "";
    var set = new Set();
    paths.forEach(function (full) {
      if (parentPath) {
        if (full.length <= prefix.length || full.indexOf(prefix) !== 0) return;
      }
      var rest = parentPath ? full.slice(prefix.length) : full;
      var seg = rest.split("/")[0];
      if (seg) set.add(seg);
    });
    return Array.from(set).sort(function (a, b) { return a.localeCompare(b, "th"); });
  }

  // Builds the whole nested folder structure (relative to the task) from
  // every distinct relative path — including "virtual" intermediate
  // folders implied by deeper paths — so the picker renders it as one tree.
  function buildFolderTree(paths) {
    var root = { name: "", path: "", children: {} };
    paths.forEach(function (full) {
      // Filters out empty segments from any already-malformed legacy path
      // (e.g. "Parent//Child" from before folder names were stopped from
      // accepting "/") so it collapses to "Parent/Child" instead of adding
      // a blank folder row in between.
      var segs = full.split("/").filter(Boolean), node = root, cur = "";
      segs.forEach(function (seg) {
        cur = cur ? cur + "/" + seg : seg;
        if (!node.children[seg]) node.children[seg] = { name: seg, path: cur, children: {} };
        node = node.children[seg];
      });
    });
    return root;
  }

  var fpFolderIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>';
  var fpChevronRight = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>';
  var fpChevronDown = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>';
  var fpPlusIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>';

  function renderFolderPickerList(pop, item) {
    var qRaw = folderPickerQuery.trim();
    var q = qRaw.toLowerCase();
    var paths = distinctSubfolders(folderPickerTask);
    var root = buildFolderTree(paths);

    function nodeMatches(node) {
      if (!q) return true;
      if (node.name.toLowerCase().indexOf(q) !== -1) return true;
      return Object.keys(node.children).some(function (k) { return nodeMatches(node.children[k]); });
    }

    function renderNode(node, depth) {
      var keys = Object.keys(node.children).sort(function (a, b) { return a.localeCompare(b, "th"); });
      var visibleKeys = keys.filter(function (k) { return nodeMatches(node.children[k]); });
      var hasChildren = keys.length > 0;
      var expanded = q ? true : folderTreeExpanded.has(node.path); // searching auto-expands every match
      var active = (item.folder || "") === node.path;
      var creatingHere = folderTreeCreateUnder === node.path;

      var row = '<div class="fp-tree-row' + (creatingHere ? ' fp-tree-row-creating' : '') + '" style="padding-left:' + (depth * 14) + 'px">' +
          (hasChildren
            ? '<button class="fp-tree-toggle" data-fp-toggle="' + esc(node.path) + '">' + (expanded ? fpChevronDown : fpChevronRight) + '</button>'
            : '<span class="fp-tree-spacer"></span>') +
          '<button class="fp-tree-select' + (active ? ' active' : '') + '" data-folder-name="' + esc(node.path) + '" title="' + esc(folderPickerTask.name + "/" + node.path) + '">' + fpFolderIcon + '<span>' + esc(node.name) + '</span></button>' +
          '<button class="fp-tree-add' + (creatingHere ? ' active' : '') + '" data-fp-add-under="' + esc(node.path) + '" title="' + esc(tr("board.addSubfolderHere")) + '">' + fpPlusIcon + '</button>' +
        '</div>';

      var childrenHtml = hasChildren && expanded ? visibleKeys.map(function (k) { return renderNode(node.children[k], depth + 1); }).join("") : "";
      return row + childrenHtml;
    }

    var topKeys = Object.keys(root.children).sort(function (a, b) { return a.localeCompare(b, "th"); });
    var visibleTop = topKeys.filter(function (k) { return nodeMatches(root.children[k]); });
    var treeHtml = visibleTop.map(function (k) { return renderNode(root.children[k], 0); }).join("");
    if (!treeHtml) treeHtml = '<div class="owner-picker-empty">' + esc(tr("ws.noAssetsMatch")) + '</div>';

    // The search box always creates/assigns relative to folderTreeCreateUnder
    // ("" = directly under the task; a node's "+" narrows it further) —
    // shown as a small context label above the box so it's never ambiguous
    // which level a new folder would land in.
    var createChildren = folderChildren(paths, folderTreeCreateUnder);
    var exactMatch = createChildren.some(function (f) { return f.toLowerCase() === q; });
    var createContextLabel = folderTreeCreateUnder
      ? esc(tr("board.addingUnder").replace("{name}", folderTreeCreateUnder.split("/").pop()))
      : esc(tr("board.addingUnder").replace("{name}", folderPickerTask.name));

    var createHtml = (qRaw && !exactMatch)
      ? '<button class="owner-picker-row fp-create-row" data-folder-create="' + esc(qRaw) + '">' +
          fpPlusIcon +
          '<span>' + esc(tr("board.createFolder").replace("{name}", qRaw)) + '</span>' +
        '</button>'
      : (qRaw ? "" : '<div class="folder-picker-hint">' + esc(tr("board.folderCreateHint")) + '</div>');

    var searchHtml = '<div class="fp-create-context">' + createContextLabel + '</div>' +
      '<div class="owner-picker-search"><input type="text" id="folderPickerSearch" placeholder="' + esc(tr("common.search")) + '" value="' + esc(folderPickerQuery) + '" /></div>';

    pop.innerHTML = '<div class="group-popover-label">' + esc(tr("board.assignFolder")) + '</div>' +
      '<button class="owner-picker-row owner-picker-clear" data-folder-name="">' + esc(tr("board.unassignedFolder")) + '</button>' +
      '<div class="fp-tree">' + treeHtml + '</div>' +
      searchHtml + createHtml;

    var searchInput = document.getElementById("folderPickerSearch");
    searchInput.addEventListener("input", function (e) {
      // A single folder level can never contain "/" — it's the path
      // separator used everywhere else (item.folder, breadcrumbs, the
      // create prefix below). Left in, a leading/trailing "/" here
      // combines with that prefix into a malformed path with an empty
      // segment (e.g. "Parent//Child") that renders as a blank folder row.
      var sanitized = e.target.value.replace(/\//g, "");
      if (sanitized !== e.target.value) {
        var pos = e.target.selectionStart - (e.target.value.length - sanitized.length);
        e.target.value = sanitized;
        e.target.setSelectionRange(pos, pos);
      }
      folderPickerQuery = sanitized;
      renderFolderPickerList(pop, item);
    });
    searchInput.addEventListener("keydown", function (e) {
      e.stopPropagation();
      if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault();
        if (!folderPickerQuery.trim()) return; // nothing typed — don't clear/select by accident
        // Enter submits: prefer an exact-match existing folder, otherwise
        // create+assign a new (sub)folder named after the current search text.
        var prefix = folderTreeCreateUnder ? folderTreeCreateUnder + "/" : "";
        var exactBtn = pop.querySelector('[data-folder-create]') ||
          Array.prototype.find.call(pop.querySelectorAll("[data-folder-name]"), function (b) {
            return b.dataset.folderName && b.dataset.folderName.toLowerCase() === (prefix + folderPickerQuery.trim()).toLowerCase();
          });
        if (exactBtn) exactBtn.click();
      }
    });
    searchInput.focus();
    var pos = searchInput.value.length;
    searchInput.setSelectionRange(pos, pos);

    pop.querySelectorAll("[data-folder-name]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        item.folder = btn.dataset.folderName;
        // Folder assignment is a discrete, decisive action (unlike a text
        // field debounced while typing) — save immediately so a quick
        // navigation right after doesn't race the normal 600ms autosave
        // debounce and drop the change before it reaches the server.
        PM.saveNow(); render();
        closeFolderPicker();
      });
    });
    pop.querySelectorAll("[data-fp-toggle]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var p = btn.dataset.fpToggle;
        if (folderTreeExpanded.has(p)) folderTreeExpanded.delete(p); else folderTreeExpanded.add(p);
        renderFolderPickerList(pop, item);
      });
    });
    pop.querySelectorAll("[data-fp-add-under]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var p = btn.dataset.fpAddUnder;
        folderTreeCreateUnder = folderTreeCreateUnder === p ? "" : p;
        if (p) folderTreeExpanded.add(p); // reveal it so the new child shows once created
        folderPickerQuery = "";
        renderFolderPickerList(pop, item);
        var si = document.getElementById("folderPickerSearch");
        if (si) si.focus();
      });
    });
    var createBtn = pop.querySelector("[data-folder-create]");
    if (createBtn) createBtn.addEventListener("click", function () {
      var prefix = folderTreeCreateUnder ? folderTreeCreateUnder + "/" : "";
      item.folder = prefix + createBtn.dataset.folderCreate;
      if (folderTreeCreateUnder) folderTreeExpanded.add(folderTreeCreateUnder);
      PM.saveNow(); render();
      closeFolderPicker();
    });
  }

  function openFolderPicker(anchorEl, item, parentTask) {
    closeOwnerPicker();
    closeFolderPicker();
    folderPickerQuery = "";
    folderTreeCreateUnder = "";
    folderTreeExpanded = new Set();
    folderPickerTask = parentTask;
    // Auto-expand every ancestor of the subitem's current folder so its
    // whole branch is visible in the tree right away, instead of starting
    // fully collapsed and making you re-open each level by hand.
    if (item.folder) {
      var segs = item.folder.split("/"), cur = "";
      segs.slice(0, -1).forEach(function (seg) {
        cur = cur ? cur + "/" + seg : seg;
        folderTreeExpanded.add(cur);
      });
    }
    var rect = anchorEl.getBoundingClientRect();
    var pop = document.createElement("div");
    pop.className = "group-popover owner-picker-popover";
    pop.id = "folderPickerPopover";
    pop.style.position = "fixed";
    pop.style.width = "240px";
    pop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 256)) + "px";
    pop.style.top = Math.min(rect.bottom + 6, window.innerHeight - 340) + "px";
    pop.style.zIndex = "95";
    document.body.appendChild(pop);

    renderFolderPickerList(pop, item);

    folderPickerOutsideHandler = function (e) {
      if (!pop.contains(e.target)) closeFolderPicker();
    };
    setTimeout(function () { document.addEventListener("mousedown", folderPickerOutsideHandler, true); }, 0);
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("folderPickerPopover")) closeFolderPicker();
  });

  // ---------------- new task / new group menu ----------------
  // The caret next to "+ New task" opens this: pick which existing group a
  // new task should land in, or start a brand-new group (which becomes a
  // new root folder name, since a task's folder is always its own group's
  // — no, its own name — see renderRow). Groups are the "main task"
  // categories (e.g. "Design", "Procurement") that individual tasks and
  // their folders live under.
  var newTaskMenuOutsideHandler = null;

  function closeNewTaskMenu() {
    var el = document.getElementById("newTaskMenuPopover");
    if (el) el.remove();
    if (newTaskMenuOutsideHandler) {
      document.removeEventListener("mousedown", newTaskMenuOutsideHandler, true);
      newTaskMenuOutsideHandler = null;
    }
  }

  function openNewTaskMenu(anchorEl) {
    closeNewTaskMenu();
    var rect = anchorEl.getBoundingClientRect();
    var pop = document.createElement("div");
    pop.className = "group-popover owner-picker-popover";
    pop.id = "newTaskMenuPopover";
    pop.style.position = "fixed";
    pop.style.width = "210px";
    pop.style.left = Math.max(8, Math.min(rect.right - 210, window.innerWidth - 226)) + "px";
    pop.style.top = Math.min(rect.bottom + 6, window.innerHeight - 280) + "px";
    pop.style.zIndex = "95";

    var groupsHtml = PM.state.groups.map(function (g) {
      return '<button class="owner-picker-row" data-ntm-group="' + g.id + '">' +
          '<span class="ntm-group-dot" style="background:' + g.color + '"></span><span>' + esc(g.name) + '</span>' +
        '</button>';
    }).join("") || '<div class="owner-picker-empty">' + esc(tr("board.noGroupsYet")) + '</div>';

    pop.innerHTML = '<div class="group-popover-label">' + esc(tr("board.addTaskTo")) + '</div>' +
      groupsHtml +
      '<button class="owner-picker-row fp-create-row" data-ntm-new-group>' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>' +
        '<span>' + esc(tr("board.newGroup")) + '</span>' +
      '</button>';

    document.body.appendChild(pop);

    pop.querySelectorAll("[data-ntm-group]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        addTask(btn.dataset.ntmGroup);
        closeNewTaskMenu();
      });
    });
    pop.querySelector("[data-ntm-new-group]").addEventListener("click", function () {
      addGroup();
      closeNewTaskMenu();
      var newG = PM.state.groups[PM.state.groups.length - 1];
      var input = document.querySelector('.group-name[data-group="' + newG.id + '"]');
      if (input) { input.focus(); input.select(); }
    });

    newTaskMenuOutsideHandler = function (e) {
      if (!pop.contains(e.target) && e.target.id !== "newTaskCaret" && !e.target.closest("#newTaskCaret")) closeNewTaskMenu();
    };
    setTimeout(function () { document.addEventListener("mousedown", newTaskMenuOutsideHandler, true); }, 0);
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("newTaskMenuPopover")) closeNewTaskMenu();
  });

  // ---------------- invite panel ----------------
  // Picks from the workspace's full member list (Manage users) which ones
  // are invited onto THIS project specifically — separate from workspace
  // membership, which is everyone.

  var inviteAllUsers = null; // null = not loaded yet
  var projectMemberIds = new Set();
  var projectMembersFull = []; // this project's invited members (incl. creator) — owner picker source
  var inviteSearchQuery = "";
  var INVITE_UNASSIGNED_KEY = " unassigned";
  var collapsedInviteDepts = new Set();

  function updateInviteCountBadge() {
    var el = document.getElementById("inviteCountBadge");
    if (el) el.textContent = String(projectMemberIds.size);
  }

  function inviteMatchesSearch(u) {
    if (!inviteSearchQuery) return true;
    var q = inviteSearchQuery.toLowerCase();
    return (u.name || "").toLowerCase().indexOf(q) !== -1 || (u.email || "").toLowerCase().indexOf(q) !== -1;
  }

  function groupInviteUsersByDepartment(list) {
    var groups = [];
    list.forEach(function (u) {
      var name = (u.department || "").trim();
      var key = name || INVITE_UNASSIGNED_KEY;
      var group = groups.find(function (g) { return g.key === key; });
      if (!group) { group = { key: key, name: name, items: [] }; groups.push(group); }
      group.items.push(u);
    });
    groups.sort(function (a, b) {
      if (a.key === INVITE_UNASSIGNED_KEY) return 1;
      if (b.key === INVITE_UNASSIGNED_KEY) return -1;
      return a.name.localeCompare(b.name, "th");
    });
    return groups;
  }

  function renderInviteRow(u) {
    var isMember = projectMemberIds.has(u.id);
    return '<div class="member-item">' +
      '<div class="owner-avatar" style="background:' + PM.avatarColor(u.name) + '">' + esc(PM.initials(u.name)) + '</div>' +
      '<div class="member-main">' +
        '<div class="member-name-row">' +
          '<span class="member-name">' + esc(u.name) + '</span>' +
          '<span class="pill role-' + u.role + ' member-role-pill">' + esc(tr("users.role." + u.role)) + '</span>' +
        '</div>' +
        '<div class="member-email">' + esc(u.email || "") + '</div>' +
      '</div>' +
      '<button class="bulk-btn' + (isMember ? ' danger' : '') + '" data-action="toggle-invite" data-user="' + esc(u.id) + '">' +
        (isMember ? esc(tr("tb.inviteRemove")) : esc(tr("tb.inviteAdd"))) +
      '</button>' +
    '</div>';
  }

  function renderInviteGroup(g) {
    var visibleItems = g.items.filter(inviteMatchesSearch);
    if (inviteSearchQuery && visibleItems.length === 0) return "";
    var collapsed = collapsedInviteDepts.has(g.key);
    var label = g.key === INVITE_UNASSIGNED_KEY ? tr("users.unassignedGroup") : g.name;
    return '<div class="member-group' + (collapsed ? ' collapsed' : '') + '" data-dept="' + esc(g.key) + '">' +
      '<div class="member-group-head" data-action="toggle-invite-dept" data-dept="' + esc(g.key) + '">' +
        '<svg class="member-group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>' +
        '<span class="member-group-name">' + esc(label) + '</span>' +
        '<span class="member-group-count">' + g.items.length + '</span>' +
      '</div>' +
      '<div class="member-group-items">' + visibleItems.map(renderInviteRow).join("") + '</div>' +
    '</div>';
  }

  function renderInviteBody() {
    var body = document.getElementById("inviteBody");
    if (!inviteAllUsers) {
      body.innerHTML = '<div class="no-updates">' + esc(tr("users.loadError")) + '</div>';
      return;
    }
    var groups = groupInviteUsersByDepartment(inviteAllUsers);
    var groupsHtml = groups.map(renderInviteGroup).join("") || '<div class="no-updates">' + esc(tr("users.noUsers")) + '</div>';

    body.innerHTML =
      '<p class="muted" style="margin:0 0 12px;font-size:12.5px;">' + esc(tr("tb.inviteHint")) + '</p>' +
      '<label class="search-box" id="inviteSearchBox" style="margin-bottom:12px;">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
        '<input class="search-input" id="inviteSearchInput" placeholder="' + esc(tr("common.search")) + '" value="' + esc(inviteSearchQuery) + '" style="width:100%;" />' +
      '</label>' +
      groupsHtml;

    var searchInput = document.getElementById("inviteSearchInput");
    searchInput.addEventListener("input", function (e) { inviteSearchQuery = e.target.value; renderInviteBody(); });
    // Re-focus + restore cursor position after the re-render above wipes it.
    searchInput.focus();
    var pos = searchInput.value.length;
    searchInput.setSelectionRange(pos, pos);

    body.querySelectorAll('[data-action="toggle-invite-dept"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var key = el.dataset.dept;
        if (collapsedInviteDepts.has(key)) collapsedInviteDepts.delete(key); else collapsedInviteDepts.add(key);
        renderInviteBody();
      });
    });
    body.querySelectorAll('[data-action="toggle-invite"]').forEach(function (el) {
      el.addEventListener("click", function () { handleToggleInvite(el.dataset.user); });
    });
  }

  function handleToggleInvite(userId) {
    if (!PM.currentProjectId) return;
    var isMember = projectMemberIds.has(userId);
    var request = isMember
      ? PM.removeProjectMember(PM.currentProjectId, userId)
      : PM.addProjectMember(PM.currentProjectId, userId);
    request.then(function () {
      if (isMember) {
        projectMemberIds.delete(userId);
        projectMembersFull = projectMembersFull.filter(function (u) { return u.id !== userId; });
      } else {
        projectMemberIds.add(userId);
        var added = inviteAllUsers && inviteAllUsers.find(function (u) { return u.id === userId; });
        if (added && !projectMembersFull.some(function (u) { return u.id === userId; })) projectMembersFull.push(added);
      }
      updateInviteCountBadge();
      renderInviteBody();
      showToast(isMember ? tr("tb.inviteRemoved") : tr("tb.inviteAdded"));
    }).catch(function () { showToast(tr("tb.inviteError")); });
  }

  function openInvitePanel() {
    document.getElementById("invitePanel").classList.add("open");
    document.getElementById("inviteBackdrop").classList.add("open");
    if (!PM.currentProjectId) {
      document.getElementById("inviteBody").innerHTML = '<div class="no-updates">' + esc(tr("tb.inviteError")) + '</div>';
      return;
    }
    if (inviteAllUsers) {
      renderInviteBody();
    } else {
      document.getElementById("inviteBody").innerHTML = '<div class="no-updates">' + esc(tr("users.loadError")) + '</div>';
      Promise.all([PM.loadUsers(), PM.loadProjectMembers(PM.currentProjectId)]).then(function (results) {
        inviteAllUsers = results[0];
        projectMemberIds = new Set(results[1].map(function (u) { return u.id; }));
        projectMembersFull = results[1];
        updateInviteCountBadge();
        renderInviteBody();
      }).catch(function () {
        document.getElementById("inviteBody").innerHTML = '<div class="no-updates">' + esc(tr("users.loadError")) + '</div>';
      });
    }
  }

  function closeInvitePanel() {
    document.getElementById("invitePanel").classList.remove("open");
    document.getElementById("inviteBackdrop").classList.remove("open");
  }

  document.getElementById("inviteBtn").addEventListener("click", openInvitePanel);
  document.getElementById("inviteCloseBtn").addEventListener("click", closeInvitePanel);
  document.getElementById("inviteBackdrop").addEventListener("click", closeInvitePanel);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("invitePanel").classList.contains("open")) closeInvitePanel();
  });

  // Load the project's member count on page load too, so the "Invite · N"
  // badge is accurate even before the panel is ever opened.
  function loadInviteCountOnly() {
    if (!PM.currentProjectId) return Promise.resolve();
    return PM.loadProjectMembers(PM.currentProjectId).then(function (list) {
      projectMemberIds = new Set(list.map(function (u) { return u.id; }));
      projectMembersFull = list;
      updateInviteCountBadge();
    }).catch(function () {});
  }

  // ---------------- init ----------------
  // Gated: nothing else runs until the session is confirmed valid server-side.

  PM.requireAuth().then(function () {
    PM.resolveProjectId();
    PM.state = PM.loadCachedState() || PM.seedState();
    document.getElementById("boardTitle").value = PM.state.title || ""; syncBudgetInput();
    applyColumnVisibility();
    PM.initSidebar("board", render);
    render();

    if (PM.currentProjectId) {
      loadInviteCountOnly();
      PM.fetchProjectState(PM.currentProjectId).then(function (data) {
        PM.state = data;
        document.getElementById("boardTitle").value = PM.state.title || ""; syncBudgetInput();
        render();
        PM.loadProjectList();
        openTaskFromUrlIfPresent();
      }).catch(function () {
        showToast("Offline — using local data (API unreachable)");
      });
    } else {
      // No project id anywhere yet (first-ever visit) — try the legacy
      // single-project endpoint so an existing server-side project still loads.
      PM.fetchProjectState(null).then(function (data) {
        PM.state = data;
        if (data.id) {
          PM.currentProjectId = data.id;
          try { localStorage.setItem(PM.CURRENT_PROJECT_KEY, data.id); } catch (e) {}
        }
        document.getElementById("boardTitle").value = PM.state.title || ""; syncBudgetInput();
        render();
        PM.loadProjectList();
        loadInviteCountOnly();
      }).catch(function () {
        showToast("Offline — using local data (API unreachable)");
      });
    }
  }).catch(function () {}); // requireAuth already redirected to login.html
})();
</script>
