<script src="shared/shared.js?v=67"></script>
<script>
(function () {
  "use strict";
  var PM = window.PM;

  // ---------------- board-local UI state (mirrors the original SPA's module vars) ----------------
  var searchQuery = "";
  var selected = new Set(); // "task:ID" or "sub:PARENTID:ID"
  var openPopoverGroup = null;
  var openDateRangePopover = null; // task id
  var dateRangeDraft = null; // { start, due } while the popover is open
  var dateRangeViewYear = null;
  var dateRangeViewMonth = null; // 0-indexed
  var openStuckReasonPopover = null; // task or subitem id (globally unique via uid())
  var stuckAttachTargetId = null; // item id the hidden stuck-reason file input is currently bound to
  var stuckFileInputEl = null;
  var activePanelTaskId = null;
  var replyTargetUpdateId = null; // which top-level update the reply bar is threading under, or null for none

  function findTask(id) { return PM.findTask(id); }
  function findGroup(id) { return PM.findGroup(id); }
  function findSub(taskId, subId) { return PM.findSub(taskId, subId); }

  // The Updates panel opens for a task OR one of its subitems — both have
  // their own independent updates list. Subitem ids (like task ids) are
  // generated with uid() and never collide project-wide, so a bare id is
  // enough to find either one and its parent task in one lookup.
  function findUpdatable(id) {
    var t = findTask(id);
    if (t) return { item: t, parentTask: t, isSub: false };
    for (var i = 0; i < PM.state.tasks.length; i++) {
      var task = PM.state.tasks[i];
      var sub = (task.subitems || []).find(function (s) { return s.id === id; });
      if (sub) return { item: sub, parentTask: task, isSub: true };
    }
    return null;
  }
  function tr(key) { return PM.tr(key); }
  function esc(s) { return PM.esc(s); }
  var folderChipIconSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>';
  function statusLabel(k) { return PM.statusLabel(k); }
  function fmtDate(s) { return PM.fmtDate(s); }
  function fmtRangeEnd(a, b) { return PM.fmtRangeEnd(a, b); }
  function fmtDuration(a, b) { return PM.fmtDuration(a, b); }
  function overdueDays(due, status) { return PM.overdueDays(due, status); }
  function overdueLabel(n) { return PM.overdueLabel(n); }
  function overdueShort(n) { return PM.overdueShort(n); }
  function todayIso() { return PM.todayIso(); }
  function isoToMDY(s) { return PM.isoToMDY(s); }
  function mdyToIso(s) { return PM.mdyToIso(s); }
  function daysBetweenInclusive(a, b) { return PM.daysBetweenInclusive(a, b); }
  function avatarColor(n) { return PM.avatarColor(n); }
  function initials(n) { return PM.initials(n); }
  function uid() { return PM.uid(); }
  function showToast(msg) { PM.showToast(msg); }
  function persist() { PM.persist(); }
  function taskDurationDays(t) { return PM.taskDurationDays(t); }
  function allocatedDaysTotal() { return PM.allocatedDaysTotal(); }
  function lang() { return PM.lang; }

  function taskMatchesSearch(t) {
    if (!searchQuery) return true;
    var q = searchQuery.toLowerCase();
    if ((t.name || "").toLowerCase().indexOf(q) !== -1) return true;
    if ((t.owner || "").toLowerCase().indexOf(q) !== -1) return true;
    return t.subitems.some(function (s) {
      return (s.name || "").toLowerCase().indexOf(q) !== -1 || (s.owner || "").toLowerCase().indexOf(q) !== -1;
    });
  }

  // "Person" toolbar filter — restricts the board to tasks (or subitems)
  // owned by one of the selected project members. Empty set = no filter.
  var personFilterSet = new Set();

  function taskMatchesPersonFilter(t) {
    if (personFilterSet.size === 0) return true;
    if (personFilterSet.has(t.owner)) return true;
    return t.subitems.some(function (s) { return personFilterSet.has(s.owner); });
  }

  function taskVisible(t) { return taskMatchesSearch(t) && taskMatchesPersonFilter(t); }

  // ---------------- render ----------------

  function render() {
    renderBoard();
    renderBulkBar();
    renderPanel();
    PM.syncSidebarLinks();
    PM.renderSidebarProgress();
    renderBudgetSummary();
  }

  function renderBoard() {
    var board = document.getElementById("board");
    if (!PM.state.groups.length) {
      board.innerHTML = '<div class="empty-board">' + (PM.lang === "th"
        ? 'ยังไม่มีกลุ่มงาน — คลิก <strong>' + tr("toolbar.newTask") + '</strong> หรือเพิ่มกลุ่มเพื่อเริ่มต้น'
        : 'No groups yet — click <strong>New task</strong> or add a group to get started.') + '</div>';
      return;
    }
    board.innerHTML = PM.state.groups.map(renderGroup).join("");
  }

  function colHeaders() {
    return '<div class="row-grid col-headers">' +
      '<div></div><div></div><div>' + tr("col.task") + '</div><div></div><div class="col-owner">' + tr("col.owner") + '</div>' +
      '<div class="col-status">' + tr("col.status") + '</div><div class="col-due">' + tr("col.dueDate") + '</div><div class="col-timeline">' + tr("col.timeline") + '</div>' +
      '<div class="col-folder">' + tr("col.folder") + '</div></div>';
  }

  function renderGroup(g) {
    var allTasks = PM.state.tasks.filter(function (t) { return t.groupId === g.id; });
    var tasks = allTasks.filter(taskVisible);
    if ((searchQuery || personFilterSet.size) && tasks.length === 0) return "";

    var swatches = PM.GROUP_COLORS.map(function (c) {
      return '<button class="color-dot' + (c === g.color ? ' active' : '') + '" style="background:' + c + '" ' +
        'data-action="set-color" data-group="' + g.id + '" data-color="' + c + '" aria-label="เปลี่ยนสีกลุ่ม"></button>';
    }).join("");

    var popoverOpen = openPopoverGroup === g.id;
    var popover = popoverOpen ? (
      '<div class="group-popover" data-stop="1">' +
        '<div class="group-popover-label">' + (PM.lang === "th" ? "สีของกลุ่ม" : "Group color") + '</div>' +
        '<div class="swatch-row">' + swatches + '</div>' +
        '<button class="popover-delete" data-action="delete-group" data-group="' + g.id + '">' + (PM.lang === "th" ? "ลบกลุ่ม" : "Delete group") + '</button>' +
      '</div>'
    ) : "";

    var rows = tasks.map(function (t) { return renderTaskBlock(t); }).join("");

    return '<div class="group' + (g.collapsed ? ' collapsed' : '') + '" data-group="' + g.id + '">' +
      '<div class="group-head" style="color:' + g.color + '">' +
        '<button class="group-collapse" data-action="toggle-collapse" data-group="' + g.id + '" aria-label="ย่อ/ขยายกลุ่ม">' +
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>' +
        '</button>' +
        '<input class="group-name" style="color:' + g.color + '" data-field="rename-group" data-group="' + g.id + '" value="' + esc(g.name) + '" />' +
        '<span class="group-count">' + allTasks.length + '</span>' +
        '<div class="group-kebab-wrap' + (popoverOpen ? ' open' : '') + '">' +
          '<button class="group-kebab" data-action="toggle-popover" data-group="' + g.id + '" aria-label="ตัวเลือกกลุ่ม">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>' +
          '</button>' + popover +
        '</div>' +
      '</div>' +
      '<div class="table-wrap">' +
        (tasks.length ? colHeaders() : '') +
        rows +
        '<div class="add-task-row"><div class="add-link-row" data-action="add-task" data-group="' + g.id + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>' +
          tr("board.addTask") + '</div></div>' +
      '</div>' +
    '</div>';
  }

  function renderTaskBlock(t) {
    var hasSub = t.subitems.length > 0;
    var open = !!t.subitemsOpen;
    var checked = selected.has("task:" + t.id);
    var taskOverdue = overdueDays(t.due, t.status);

    var ownerHtml = t.owner
      ? '<button class="owner-avatar" style="background:' + avatarColor(t.owner) + '" data-action="edit-owner" data-task="' + t.id + '" title="' + esc(t.owner) + '">' + esc(initials(t.owner)) + '</button>'
      : '<button class="owner-avatar empty" data-action="edit-owner" data-task="' + t.id + '" title="' + tr("board.assignOwner") + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>';

    var statusOpts = PM.STATUS_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === t.status ? ' selected' : '') + '>' + statusLabel(k) + '</option>';
    }).join("");
    // A task's own folder root is always its own name — not separately
    // editable, so it can never drift out of sync with the task. Subitems
    // are the ones that get to freely pick a subfolder underneath it (see
    // renderSubRow). The old free-form t.folder column/value is preserved
    // in the database but no longer read here.
    var folderHtml = '<span class="folder-chip readonly" title="' + esc(t.name || tr("board.taskPlaceholder")) + '">' + folderChipIconSvg + '<span class="folder-chip-label">' + esc(t.name) + '</span></span>';

    var timelineActive = t.status === "working";
    var updateCount = (t.updates || []).length;
    var bubbleHtml = '<button class="update-bubble-btn' + (updateCount ? ' has-updates' : '') + '" data-action="open-panel" data-task="' + t.id + '" title="Updates" aria-label="เปิดอัปเดตงาน">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="' + (updateCount ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 01-9 8.5A8.4 8.4 0 013 11.5a8.5 8.5 0 0117 0z"/></svg>' +
      (updateCount ? updateCount : '') +
    '</button>';

    var row = '<div class="row-grid task-row' + (activePanelTaskId === t.id ? ' panel-open' : '') + '" data-task="' + t.id + '">' +
      '<div class="cell row-checkbox"><input type="checkbox" data-action="select" data-key="task:' + t.id + '"' + (checked ? ' checked' : '') + ' aria-label="เลือกงาน" /></div>' +
      '<div class="cell"><button class="expand-toggle' + (open ? ' open' : '') + (hasSub ? '' : ' no-sub') + '" data-action="toggle-sub" data-task="' + t.id + '" aria-label="ขยายงานย่อย">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button></div>' +
      '<div class="cell task-name-cell">' +
        '<input type="text" class="task-name-input" data-field="name" data-task="' + t.id + '" value="' + esc(t.name) + '" placeholder="' + tr("board.taskPlaceholder") + '" />' +
        (hasSub ? '<span class="sub-badge" data-action="toggle-sub" data-task="' + t.id + '">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>' +
          t.subitems.length + '</span>' : '') +
      '</div>' +
      '<div class="cell">' + bubbleHtml + '</div>' +
      '<div class="cell col-owner">' + ownerHtml + '</div>' +
      '<div class="cell col-status"><span class="status-wrap">' +
        '<select class="pill status-' + t.status + '" data-field="status" data-task="' + t.id + '">' + statusOpts + '</select>' +
        (taskOverdue ? '<span class="overdue-dot" title="' + esc(overdueLabel(taskOverdue)) + '">' + taskOverdue + '</span>' : '') +
        stuckReasonBtnHtml(t.id, t.status, t.stuckReason) +
      '</span></div>' +
      '<div class="cell due-cell col-due">' + dueIcon(t.status) +
        '<span class="date-field">' +
          '<input type="date" data-field="due" data-task="' + t.id + '" value="' + esc(t.due || '') + '" />' +
          '<span class="date-display' + (t.due ? '' : ' is-empty') + (taskOverdue ? ' is-overdue' : '') + '">' + esc(t.due ? fmtDate(t.due) : '–') + '</span>' +
        '</span>' +
        (taskOverdue ? '<span class="overdue-tag" title="' + esc(overdueLabel(taskOverdue)) + '">' + esc(overdueShort(taskOverdue)) + '</span>' : '') +
      '</div>' +
      '<div class="cell col-timeline"><div class="timeline-wrap">' +
        '<button type="button" class="timeline-pill' + (timelineActive ? ' active' : '') + '" data-action="toggle-date-popover" data-task="' + t.id + '">' +
          (t.start || t.due
            ? '<span class="tl-date">' + esc(t.start ? fmtDate(t.start) : '–') + '</span>' +
              '<span class="timeline-sep">–</span>' +
              '<span class="tl-date">' + esc(t.due ? fmtRangeEnd(t.start, t.due) : '–') + '</span>' +
              '<span class="timeline-duration">' + esc(fmtDuration(t.start, t.due)) + '</span>'
            : '<span class="tl-empty">' + tr("board.setDates") + '</span>') +
        '</button>' +
        (openDateRangePopover === t.id ? renderDateRangePopover(t) : '') +
      '</div></div>' +
      '<div class="cell col-folder">' + folderHtml + '</div>' +
    '</div>';

    var subPanel = "";
    if (open) {
      var subRows = t.subitems.map(function (s) { return renderSubRow(t, s); }).join("");
      subPanel = '<div class="subitem-panel">' +
        '<div class="sub-row-grid sub-col-headers"><div></div><div>' + tr("col.subitem") + '</div><div></div><div class="col-owner">' + tr("col.owner") + '</div><div class="col-status">' + tr("col.status") + '</div><div class="col-due">' + tr("col.date") + '</div><div class="col-folder">' + tr("col.folder") + '</div></div>' +
        subRows +
        '<div class="add-link-row" data-action="add-sub" data-task="' + t.id + '">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>' + tr("board.addSubitem") + '</div>' +
      '</div>';
    }

    return '<div class="task-block">' + row + subPanel + '</div>';
  }

  function renderSubRow(t, s) {
    var taskId = t.id;
    var checked = selected.has("sub:" + taskId + ":" + s.id);
    var ownerHtml = s.owner
      ? '<button class="owner-avatar" style="background:' + avatarColor(s.owner) + '" data-action="edit-sub-owner" data-task="' + taskId + '" data-sub="' + s.id + '" title="' + esc(s.owner) + '">' + esc(initials(s.owner)) + '</button>'
      : '<button class="owner-avatar empty" data-action="edit-sub-owner" data-task="' + taskId + '" data-sub="' + s.id + '" title="' + tr("board.assignOwner") + '">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>';
    var statusOpts = PM.STATUS_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (k === s.status ? ' selected' : '') + '>' + statusLabel(k) + '</option>';
    }).join("");
    var subOverdue = overdueDays(s.date, s.status);

    // A subitem's folder is stored relative to its parent task (empty =
    // sits directly under the task, no extra subfolder chosen). The chip
    // always shows a real name: the deepest chosen subfolder segment, or
    // the parent task's own name as the implicit default when none is set.
    var subFolderSegs = s.folder ? s.folder.split("/") : [];
    var subFolderLabel = subFolderSegs.length ? subFolderSegs[subFolderSegs.length - 1] : t.name;
    var subFolderFullPath = t.name + (s.folder ? "/" + s.folder : "");
    var subFolderHtml = '<button class="folder-chip' + (s.folder ? '' : ' inherited') + '" data-action="edit-sub-folder" data-task="' + taskId + '" data-sub="' + s.id + '" title="' + esc(subFolderFullPath) + '">' +
        folderChipIconSvg + '<span class="folder-chip-label">' + esc(subFolderLabel) + '</span>' +
      '</button>';

    var subUpdateCount = (s.updates || []).length;
    var subBubbleHtml = '<button class="update-bubble-btn' + (subUpdateCount ? ' has-updates' : '') + '" data-action="open-panel" data-task="' + s.id + '" title="Updates" aria-label="เปิดอัปเดตงานย่อย">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="' + (subUpdateCount ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 01-9 8.5A8.4 8.4 0 013 11.5a8.5 8.5 0 0117 0z"/></svg>' +
      (subUpdateCount ? subUpdateCount : '') +
    '</button>';

    return '<div class="sub-row-grid subitem-row' + (activePanelTaskId === s.id ? ' panel-open' : '') + '" data-sub="' + s.id + '">' +
      '<div class="cell row-checkbox"><input type="checkbox" data-action="select" data-key="sub:' + taskId + ':' + s.id + '"' + (checked ? ' checked' : '') + ' aria-label="เลือกงานย่อย" /></div>' +
      '<div class="cell"><input type="text" class="task-name-input" data-field="sub-name" data-task="' + taskId + '" data-sub="' + s.id + '" value="' + esc(s.name) + '" placeholder="' + tr("board.subitemPlaceholder") + '" /></div>' +
      '<div class="cell">' + subBubbleHtml + '</div>' +
      '<div class="cell col-owner">' + ownerHtml + '</div>' +
      '<div class="cell col-status"><span class="status-wrap">' +
        '<select class="pill status-' + s.status + '" data-field="sub-status" data-task="' + taskId + '" data-sub="' + s.id + '">' + statusOpts + '</select>' +
        (subOverdue ? '<span class="overdue-dot" title="' + esc(overdueLabel(subOverdue)) + '">' + subOverdue + '</span>' : '') +
        stuckReasonBtnHtml(s.id, s.status, s.stuckReason) +
      '</span></div>' +
      '<div class="cell due-cell col-due"><span class="date-field">' +
        '<input type="date" data-field="sub-date" data-task="' + taskId + '" data-sub="' + s.id + '" value="' + esc(s.date || '') + '" />' +
        '<span class="date-display' + (s.date ? '' : ' is-empty') + (subOverdue ? ' is-overdue' : '') + '">' + esc(s.date ? fmtDate(s.date) : '–') + '</span>' +
      '</span>' +
      (subOverdue ? '<span class="overdue-tag" title="' + esc(overdueLabel(subOverdue)) + '">' + esc(overdueShort(subOverdue)) + '</span>' : '') +
      '</div>' +
      '<div class="cell col-folder">' + subFolderHtml + '</div>' +
    '</div>';
  }

  function dueIcon(status) {
    if (status === "done") {
      return '<svg class="due-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#299d90" stroke-width="3"><title>' + esc(statusLabel("done")) + '</title><path d="M4 12l5 5L20 6"/></svg>';
    }
    if (status === "working") {
      return '<svg class="due-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f3a261" stroke-width="2.4"><title>' + esc(statusLabel("working")) + '</title><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>';
    }
    if (status === "stuck") {
      return '<svg class="due-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9699a6" stroke-width="2.2"><title>' + esc(statusLabel("stuck")) + '</title><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    }
    return '<span class="due-icon" style="width:14px;"></span>';
  }

  // Small warning icon next to the Stuck pill — only shown while the item is
  // actually stuck (the reason itself is preserved even if status changes
  // later, so switching back to Stuck restores it, but the icon only makes
  // sense to show for the current stuck state).
  function stuckReasonBtnHtml(itemId, status, reason) {
    if (status !== "stuck") return "";
    var hasReason = !!(reason && reason.trim());
    var title = hasReason ? reason : tr("stuck.addReason");
    return '<button type="button" class="stuck-reason-btn' + (hasReason ? ' has-reason' : '') + '" data-action="toggle-stuck-popover" data-item="' + itemId + '" title="' + esc(title) + '" aria-label="' + esc(tr("stuck.reasonTitle")) + '">' +
        '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M10.29 3.86L1.82 18a1.5 1.5 0 001.3 2.25h17.76a1.5 1.5 0 001.3-2.25L13.71 3.86a1.5 1.5 0 00-2.42 0z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M12 9.5v4.2M12 17h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>' +
      '</button>' +
      (openStuckReasonPopover === itemId ? renderStuckReasonPopover(itemId) : '');
  }

  function renderStuckReasonPopover(itemId) {
    var ctx = findUpdatable(itemId);
    var reason = ctx ? (ctx.item.stuckReason || "") : "";
    var attachments = ctx && Array.isArray(ctx.item.stuckAttachments) ? ctx.item.stuckAttachments : [];
    var origin = PM.API_BASE.replace(/\/api$/, "");

    var attachHtml = attachments.map(function (a) {
      var isImage = (a.mime || "").indexOf("image/") === 0;
      var fullUrl = origin + a.url;
      return '<div class="srp-attachment">' +
        (isImage
          ? '<a href="' + esc(fullUrl) + '" target="_blank" rel="noopener" class="srp-attachment-thumb-link"><img src="' + esc(fullUrl) + '" alt="' + esc(a.name) + '" class="srp-attachment-thumb" /></a>'
          : '<a href="' + esc(fullUrl) + '" target="_blank" rel="noopener" class="srp-attachment-file">📎 ' + esc(a.name) + '</a>') +
        '<button type="button" class="srp-attachment-remove" data-action="remove-stuck-attachment" data-item="' + itemId + '" data-attachment="' + esc(a.id) + '" title="' + esc(tr("stuck.removeAttachment")) + '" aria-label="' + esc(tr("stuck.removeAttachment")) + '">&times;</button>' +
      '</div>';
    }).join("");

    return '<div class="stuck-reason-popover" data-stop="1">' +
      '<div class="srp-header">' +
        '<span class="srp-title">' + esc(tr("stuck.reasonTitle")) + '</span>' +
        '<button type="button" class="srp-close" data-action="close-stuck-popover" aria-label="Close">&times;</button>' +
      '</div>' +
      '<textarea class="srp-textarea" data-field="stuck-reason" data-item="' + itemId + '" placeholder="' + esc(tr("stuck.reasonPlaceholder")) + '">' + esc(reason) + '</textarea>' +
      (attachHtml ? '<div class="srp-attachments">' + attachHtml + '</div>' : '') +
      '<button type="button" class="srp-attach-btn" data-action="trigger-stuck-attach" data-item="' + itemId + '">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>' +
        esc(tr("stuck.attachFile")) +
      '</button>' +
    '</div>';
  }

  // A single lazily-created hidden <input type=file>, reused across every
  // stuck-reason popover (they're regenerated on each render(), so the
  // input can't live inside the popover markup itself — it'd be recreated
  // mid-pick and lose the browser's file-picker binding).
  function ensureStuckFileInput() {
    if (stuckFileInputEl && document.body.contains(stuckFileInputEl)) return stuckFileInputEl;
    var input = document.createElement("input");
    input.type = "file";
    input.style.display = "none";
    input.addEventListener("change", function () {
      var file = input.files[0];
      var itemId = stuckAttachTargetId;
      input.value = "";
      if (!file || !itemId) return;
      if (file.size > 15 * 1024 * 1024) { showToast(tr("panel.attachTooLarge")); return; }
      var fd = new FormData();
      fd.append("file", file);
      showToast(tr("panel.attachUploading"));
      PM.authFetch(PM.API_BASE + "/uploads", { method: "POST", body: fd }).then(function (r) {
        if (!r.ok) throw new Error("upload failed");
        return r.json();
      }).then(function (data) {
        var ctx = findUpdatable(itemId);
        if (!ctx) return;
        if (!Array.isArray(ctx.item.stuckAttachments)) ctx.item.stuckAttachments = [];
        ctx.item.stuckAttachments.push({ id: uid(), url: data.url, name: data.name, size: data.size, mime: data.mime });
        persist();
        render();
        showToast(tr("panel.attachAdded"));
      }).catch(function () {
        showToast(tr("panel.attachError"));
      });
    });
    document.body.appendChild(input);
    stuckFileInputEl = input;
    return input;
  }

  function renderDateRangePopover(t) {
    var draft = dateRangeDraft || { start: "", due: "" };
    var count = draft.due ? daysBetweenInclusive(draft.start, draft.due) : (draft.start ? 1 : 0);
    var countLabel = count ? (count + " " + tr("board.daysSelected")) : "";

    var y = dateRangeViewYear, m = dateRangeViewMonth;
    var firstOfMonth = new Date(y, m, 1);
    var startWeekday = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrevMonth = new Date(y, m, 0).getDate();
    var today = todayIso();

    var cells = [];
    for (var i = 0; i < startWeekday; i++) {
      var pd = daysInPrevMonth - startWeekday + 1 + i;
      cells.push({ day: pd, outside: true, iso: null });
    }
    for (var d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, outside: false, iso: y + "-" + PM.pad2(m + 1) + "-" + PM.pad2(d) });
    }
    while (cells.length % 7 !== 0) {
      var nd = cells.length - (startWeekday + daysInMonth) + 1;
      cells.push({ day: nd, outside: true, iso: null });
    }

    var dayCellsHtml = cells.map(function (c) {
      if (c.outside) return '<span class="drp-day drp-outside">' + c.day + '</span>';
      var classes = "drp-day";
      if (c.iso === today) classes += " drp-today";

  function renderBudgetSummary(previewBudget) {
    var fillEl = document.getElementById("budgetFill");
    var textEl = document.getElementById("budgetAllocatedText");
    if (!fillEl || !textEl) return;
    var budget = previewBudget !== undefined ? previewBudget : PM.state.totalDaysBudget;
    var used = allocatedDaysTotal();
    if (!budget) {
      fillEl.style.width = "0%";
      fillEl.classList.remove("over");
      textEl.classList.remove("over");
      textEl.textContent = tr("board.allocatedDays").replace("{used}", used).replace("{total}", "—");
      return;
    }
    var over = used > budget;
    fillEl.style.width = Math.min(100, Math.round((used / budget) * 100)) + "%";
    fillEl.classList.toggle("over", over);
    textEl.classList.toggle("over", over);
    var label = tr("board.allocatedDays").replace("{used}", used).replace("{total}", budget);
    if (over) {
      var n = used - budget;
      label += " · " + tr("board.allocatedOverBy").replace("{n}", n).replace("{s}", n === 1 ? "" : "s");
    }
    textEl.textContent = label;
  }
  function checkBudgetWarning() {
    var budget = PM.state.totalDaysBudget;
    if (!budget) return;
    var used = allocatedDaysTotal();
    if (used > budget) {
      var n = used - budget;
      showToast(tr("board.budgetWarnToast").replace("{used}", used).replace("{total}", budget)
        .replace("{n}", n).replace("{s}", n === 1 ? "" : "s"));
    }

    PM.state.totalDaysBudget = budgetInputDraftValue();
    persist();

  // Header actions: real owner picker, real "copy task link", and a real
  // duplicate/delete menu — replacing the old data-toast placeholders.
  // `ctx` is a findUpdatable() result: { item, parentTask, isSub } — item
  // is a subitem when the panel is open for one, so duplicate/delete need
  // to operate on the parent's subitems array instead of PM.state.tasks.
  function wirePanelHeader(ctx) {
    var task = ctx.item;
    var isSub = ctx.isSub;
    var ownerBtn = document.getElementById("panelOwnerBtn");
    ownerBtn.onclick = function () { openOwnerPicker(ownerBtn, task); };

    var shareBtn = document.getElementById("panelShareBtn");
    shareBtn.onclick = function () {
      var url = new URL(window.location.href);
      url.search = "";
      if (PM.currentProjectId) url.searchParams.set("id", PM.currentProjectId);
      url.searchParams.set("task", task.id);
      var link = url.toString();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () {
          showToast(tr("panel.linkCopied"));
        }).catch(function () { showToast(link); });
      } else {
        showToast(link);
      }
    };

    // "Update via email" — this app has no inbound mail server (nothing to
    // receive/parse a reply into an update), so instead of a fake inbox
    // address, it opens the user's own mail client with the task's link and
    // latest update pre-filled — a real, working way to send this task out
    // by email, just not the round-trip monday.com does.
    var emailBtn = document.getElementById("panelEmailUpdateBtn");
    if (emailBtn) emailBtn.onclick = function () {
      var url = new URL(window.location.href);
      url.search = "";
      if (PM.currentProjectId) url.searchParams.set("id", PM.currentProjectId);
      url.searchParams.set("task", task.id);
      var updates = task.updates || [];
      var latest = updates.length ? updates[updates.length - 1] : null;
      var latestPlain = latest ? (latest.isHtml ? stripHtml(latest.text) : latest.text) : "";
      var bodyLines = [
        tr("panel.emailBodyTask") + ": " + (task.name || ""),
        tr("panel.emailBodyLink") + ": " + url.toString()
      ];
      if (latestPlain) bodyLines.push("", tr("panel.emailBodyLatest") + ": " + latestPlain);
      var mailto = "mailto:?subject=" + encodeURIComponent(tr("panel.emailSubject") + ": " + (task.name || "")) +
        "&body=" + encodeURIComponent(bodyLines.join("\n"));
      window.location.href = mailto;
    };

    var moreBtn = document.getElementById("panelMoreBtn");
    var morePopover = document.getElementById("panelMorePopover");
    moreBtn.onclick = function (e) {
      e.stopPropagation();
      morePopover.style.display = morePopover.style.display === "none" ? "block" : "none";
    };

    var duplicateBtn = document.getElementById("panelDuplicateBtn");
    var deleteBtn = document.getElementById("panelDeleteBtn");
    duplicateBtn.textContent = tr(isSub ? "panel.duplicateSubitem" : "panel.duplicateTask");
    deleteBtn.textContent = tr(isSub ? "panel.deleteSubitem" : "panel.deleteTask");

    duplicateBtn.onclick = function () {
      var copy = JSON.parse(JSON.stringify(task));
      copy.id = uid();
      copy.name = (task.name || "") + " (copy)";
      copy.updates = [];
      if (isSub) {
        var subIdx = ctx.parentTask.subitems.findIndex(function (s) { return s.id === task.id; });
        ctx.parentTask.subitems.splice(subIdx + 1, 0, copy);
      } else {
        copy.subitems = (copy.subitems || []).map(function (s) { return Object.assign({}, s, { id: uid(), updates: [] }); });
        var idx = PM.state.tasks.findIndex(function (t) { return t.id === task.id; });
        PM.state.tasks.splice(idx + 1, 0, copy);
      }
      morePopover.style.display = "none";
      persist(); render();
      showToast(tr(isSub ? "panel.subitemDuplicated" : "panel.taskDuplicated"));
    };
    deleteBtn.onclick = function () {
      var confirmMsg = tr(isSub ? "panel.deleteSubitemConfirm" : "panel.deleteTaskConfirm").replace("{name}", task.name || "");
      if (!confirm(confirmMsg)) return;
      if (isSub) {
        ctx.parentTask.subitems = ctx.parentTask.subitems.filter(function (s) { return s.id !== task.id; });
      } else {
        PM.state.tasks = PM.state.tasks.filter(function (t) { return t.id !== task.id; });
      }
      morePopover.style.display = "none";
      activePanelTaskId = null;
      persist(); render();
      showToast(tr(isSub ? "panel.subitemDeleted" : "panel.taskDeleted"));
    };
  }

  function execFormat(cmd, val) {

  // Strips script/style/embed-like tags and on*/javascript: attributes from
  // pasted or formatted HTML before it's stored — a private, auth-only tool
  // doesn't need a full sanitizer, but this is cheap insurance against a
  // hostile paste turning into stored markup.
  function sanitizeComposeHtml(html) {
    var div = document.createElement("div");
    div.innerHTML = html || "";
    div.querySelectorAll("script,style,iframe,object,embed,form").forEach(function (el) { el.remove(); });
    div.querySelectorAll("*").forEach(function (el) {
      Array.from(el.attributes).forEach(function (attr) {
        var name = attr.name.toLowerCase();
        var val = (attr.value || "").trim().toLowerCase();
        if (name.indexOf("on") === 0 || ((name === "href" || name === "src") && val.indexOf("javascript:") === 0)) {
          el.removeAttribute(attr.name);
        }
      });
    });
    return div.innerHTML;
  }

  // Collapses the live "<span class=checklist-marker>☐</span>" preview
  // back down to a bare ☐/☑ character before storing — renderChecklistMarkers
  // re-expands that character into a real checkbox <input> at render time,
  // so the stored format only ever needs to be the plain glyph.
  function unwrapChecklistMarkers(html) {
    var div = document.createElement("div");
    div.innerHTML = html || "";
    div.querySelectorAll(".checklist-marker").forEach(function (el) {
      el.replaceWith(document.createTextNode(el.textContent));
    });
    return div.innerHTML;
  }

  function stripHtml(html) {
    var div = document.createElement("div");
    div.innerHTML = html || "";
    return div.textContent.replace(/\s+/g, " ").trim();

  function wireComposeFormatToolbar() {
    var map = {
      cfBold: ["bold"], cfItalic: ["italic"], cfUnderline: ["underline"], cfStrike: ["strikeThrough"],
      cfUl: ["insertUnorderedList"], cfOl: ["insertOrderedList"], cfHr: ["insertHorizontalRule"],
      cfUndo: ["undo"], cfRedo: ["redo"]
    };
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener("click", function () { execFormat(map[id][0]); });
    });

    var pEl = document.getElementById("cfParagraph");
    if (pEl) pEl.addEventListener("click", function () { execFormat("removeFormat"); execFormat("formatBlock", "P"); });

    // Checklist item — a "☐ " marker at the start of a new line. It's real
    // text, not a placeholder icon: once posted, the marker gets swapped
    // for a live, clickable checkbox (see renderChecklistMarkers /
    // toggleChecklistItem) that actually toggles and saves state.
    var checklistEl = document.getElementById("cfChecklist");
    if (checklistEl) checklistEl.addEventListener("click", function () {
      var el = document.getElementById("composeInput");
      // A leading <br> only if there's already content on the current line
      // — otherwise (empty editor, or right after another line break) it'd
      // add a stray blank line before the first checklist item.
      var needsBreak = !!(el && el.lastChild && el.textContent.trim());
      // Not contenteditable="false" — an atomic/non-editable island there
      // makes the browser place the caret unpredictably after insertHTML,
      // so a second click-and-type would land text *before* the marker
      // instead of after it. Leaving it as normal (editable) inline content
      // keeps caret placement/typing order sane; the round-checkbox look
      // comes entirely from CSS (font-size:0 + a checkmark ::after), so
      // editability doesn't affect the visual.
      execFormat("insertHTML", (needsBreak ? "<br>" : "") +
        '<span class="checklist-marker" data-checked="false">☐</span>&nbsp;');
    });

    var alignEl = document.getElementById("cfAlign");
    if (alignEl) alignEl.addEventListener("click", function () {
      composeAlignIdx = (composeAlignIdx + 1) % COMPOSE_ALIGNS.length;
      execFormat(COMPOSE_ALIGNS[composeAlignIdx]);
    });

    var tableEl = document.getElementById("cfTable");
    if (tableEl) tableEl.addEventListener("click", function () {
      execFormat("insertHTML", '<table><tr><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr></table><br>');
    });

    var linkEl = document.getElementById("cfLink");
    if (linkEl) linkEl.addEventListener("click", function () {
      var url = prompt(tr("panel.fmtLinkPrompt"), "https://");
      if (!url || !url.trim()) return;
      var el = document.getElementById("composeInput");
      el.focus();
      var sel = window.getSelection();
      if (sel && !sel.isCollapsed && el.contains(sel.anchorNode)) {
        execFormat("createLink", url.trim());
      } else {
        execFormat("insertHTML", '<a href="' + esc(url.trim()) + '" target="_blank" rel="noopener">' + esc(url.trim()) + '</a>');
      }
    });

    var colorBtn = document.getElementById("cfColor");
    var colorPop = document.getElementById("cfColorPopover");
    if (colorBtn && colorPop) {
      colorBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var opening = colorPop.style.display === "none";
        closeComposePopovers();
        if (opening) colorPop.style.display = "block";
      });
      colorPop.querySelectorAll("[data-color]").forEach(function (sw) {
        sw.addEventListener("click", function () {
          execFormat("foreColor", sw.dataset.color);
          colorPop.style.display = "none";
        });
      });
    }

    var sizeBtn = document.getElementById("cfSize");
    var sizePop = document.getElementById("cfSizePopover");
    if (sizeBtn && sizePop) {
      sizeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var opening = sizePop.style.display === "none";
        closeComposePopovers();
        if (opening) sizePop.style.display = "block";
      });
      sizePop.querySelectorAll("[data-size]").forEach(function (b) {
        b.addEventListener("click", function () {
          execFormat("fontSize", b.dataset.size);
          sizePop.style.display = "none";
        });
      });
    }
  }

  function closeComposePopovers() {
    ["composeMentionPopover", "composeEmojiPopover", "cfColorPopover", "cfSizePopover"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = "none";
    });
  }

  // true when the popover was triggered by the user typing "@" themselves
  // (so the "@" is already in the text and clicking a name should only
  // insert the name) vs. triggered via the toolbar button (needs its own
  // "@" prefix inserted).
  var mentionTypedTrigger = false;

  function renderMentionPopover() {
    var pop = document.getElementById("composeMentionPopover");
    if (!pop) return;
    if (!projectMembersFull.length) {
      pop.innerHTML = '<div class="owner-picker-empty">' + esc(tr("board.noProjectMembers")) + '</div>';
      return;
    }
    pop.innerHTML = projectMembersFull.map(function (u) {
      return '<button class="owner-picker-row" data-mention-name="' + esc(u.name) + '">' +
        '<span class="owner-avatar" style="width:22px;height:22px;font-size:10px;background:' + avatarColor(u.name) + '">' + esc(initials(u.name)) + '</span>' +
        '<span>' + esc(u.name) + '</span>' +
      '</button>';
    }).join("");
    pop.querySelectorAll("[data-mention-name]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        insertAtCursor((mentionTypedTrigger ? "" : "@") + btn.dataset.mentionName + " ");
        closeComposePopovers();
      });

  function renderEmojiPopover() {
    var pop = document.getElementById("composeEmojiPopover");
    if (!pop) return;
    pop.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:2px;">' +
      EMOJI_SET.map(function (e) {
        return '<button type="button" class="compose-icon-btn" data-emoji="' + e + '" style="font-size:17px;">' + e + '</button>';
      }).join("") +
    '</div>';
    pop.querySelectorAll("[data-emoji]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        insertAtCursor(btn.dataset.emoji);
        closeComposePopovers();
      });

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }

  // Real file attachment: uploads to the server's /api/uploads (multer,
  // saved under server/uploads/ with a random filename) and drops a
  // download link into the compose editor — flows through the same
  // sanitize/store/render pipeline as everything else typed there.
  function wireComposeAttach() {
    var attachBtn = document.getElementById("composeAttachBtn");
    var fileInput = document.getElementById("composeFileInput");
    if (!attachBtn || !fileInput) return;
    attachBtn.addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      var file = fileInput.files[0];
      if (!file) return;
      if (file.size > 15 * 1024 * 1024) {
        showToast(tr("panel.attachTooLarge"));
        fileInput.value = "";
        return;
      }
      var fd = new FormData();
      fd.append("file", file);
      showToast(tr("panel.attachUploading"));
      PM.authFetch(PM.API_BASE + "/uploads", { method: "POST", body: fd }).then(function (r) {
        if (!r.ok) throw new Error("upload failed");
        return r.json();
      }).then(function (data) {
        var origin = PM.API_BASE.replace(/\/api$/, "");
        var fullUrl = origin + data.url;
        var isImage = (data.mime || "").indexOf("image/") === 0;
        var chip = isImage
          ? '<a href="' + esc(fullUrl) + '" target="_blank" rel="noopener"><img src="' + esc(fullUrl) + '" alt="' + esc(data.name) + '" class="update-image-attachment" /></a><br>'
          : '<a href="' + esc(fullUrl) + '" target="_blank" rel="noopener" class="update-attachment">📎 ' +
            esc(data.name) + " (" + esc(formatFileSize(data.size)) + ")</a>&nbsp;";
        execFormat("insertHTML", chip);
        showToast(tr("panel.attachAdded"));
      }).catch(function () {
        showToast(tr("panel.attachError"));
      }).then(function () { fileInput.value = ""; });
    });
  }

  function wireComposeToolbar() {
    var mentionBtn = document.getElementById("composeMentionBtn");
    var emojiBtn = document.getElementById("composeEmojiBtn");
    if (!mentionBtn || !emojiBtn) return;

    // Sanitize on paste, not just at post time — insertHTML puts pasted
    // markup straight into the live, rendered DOM, so anything like an
    // <img onerror=...> would otherwise fire immediately while composing,
    // before the message is ever posted.
    var composeEl = document.getElementById("composeInput");
    if (composeEl) {
      composeEl.addEventListener("paste", function (e) {
        e.preventDefault();
        var cd = e.clipboardData || window.clipboardData;
        var html = cd && cd.getData("text/html");
        var text = cd && cd.getData("text/plain");
        if (html) {
          document.execCommand("insertHTML", false, sanitizeComposeHtml(html));
        } else {
          document.execCommand("insertText", false, text || "");
        }
      });
      // Toggle a checklist marker while still composing, same as a posted
      // one — clicking it flips the round circle, not just the underlying
      // ☐/☑ character.
      composeEl.addEventListener("click", function (e) {
        var marker = e.target.closest(".checklist-marker");
        if (!marker) return;
        e.preventDefault();
        var checked = marker.dataset.checked === "true";
        marker.dataset.checked = checked ? "false" : "true";
        marker.textContent = checked ? "☐" : "☑";
      });

      // Typing "@" opens the same mention picker as the toolbar button —
      // matches the placeholder text's own "tag with @" hint.
      composeEl.addEventListener("input", function (e) {
        if (e.data !== "@") return;
        var pop = document.getElementById("composeMentionPopover");
        mentionTypedTrigger = true;
        closeComposePopovers();
        pop.style.display = "block";
        if (projectMembersFull.length) {
          renderMentionPopover();
        } else {
          pop.innerHTML = '<div class="owner-picker-empty">' + esc(tr("users.loadError")) + '</div>';
          loadInviteCountOnly().then(renderMentionPopover);
        }
      });
    }

    mentionBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var pop = document.getElementById("composeMentionPopover");
      var opening = pop.style.display === "none";
      closeComposePopovers();
      if (opening) {
        mentionTypedTrigger = false;
        pop.style.display = "block";
        if (projectMembersFull.length) {
          renderMentionPopover();
        } else {
          pop.innerHTML = '<div class="owner-picker-empty">' + esc(tr("users.loadError")) + '</div>';
          loadInviteCountOnly().then(renderMentionPopover);
        }
      }
    });
    emojiBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var pop = document.getElementById("composeEmojiPopover");
      var opening = pop.style.display === "none";
      closeComposePopovers();
      if (opening) { pop.style.display = "block"; renderEmojiPopover(); }
    });
  }
  var IMAGE_EXT_RE = /\.(jpe?g|png|gif|webp|bmp|svg)(\?|$)/i;

  // Upgrades a plain file-chip link into an actual inline image when its
  // URL looks like an image — covers both new uploads (which insert the
  // <img> directly, see wireComposeAttach) and older attachments that were
  // posted back when only the generic 📎-chip existed.
  function upgradeImageAttachments(html) {
    var div = document.createElement("div");
    div.innerHTML = html || "";
    div.querySelectorAll("a.update-attachment").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      if (!IMAGE_EXT_RE.test(href)) return;
      var img = document.createElement("img");
      img.src = href;
      img.alt = a.textContent.replace("📎", "").trim();
      img.className = "update-image-attachment";
      var wrap = document.createElement("a");
      wrap.href = href;
      wrap.target = "_blank";
      wrap.rel = "noopener";
      wrap.appendChild(img);
      a.replaceWith(wrap);
    });
    return div.innerHTML;
  }

  function renderUpdateBody(taskId, u) {
    // Legacy rows were stored as plain text and must still be escaped;
    // rows from the rich-text compose box (isHtml) are already sanitized
    // HTML and render as-is.
    var bodyHtml = u.isHtml ? (u.text || "") : esc(u.text || "");
    if (u.isHtml) bodyHtml = upgradeImageAttachments(bodyHtml);
    return renderChecklistMarkers(bodyHtml, taskId, u.id);
  }

  function renderUpdateItem(taskId, u, replies) {
    replies = replies || [];
    var repliesHtml = replies.length
      ? '<div class="update-replies">' + replies.map(function (r) { return renderReplyItem(taskId, r); }).join("") + '</div>'
      : "";
    return '<div class="update-item">' +
      '<div class="update-avatar" style="background:' + avatarColor(u.author) + '">' + esc(initials(u.author)) + '</div>' +
      '<div class="update-main">' +
        '<div class="update-head"><span class="update-author">' + esc(u.author || "You") + '</span><span class="update-time">' + PM.timeAgo(u.time) + '</span></div>' +
        '<div class="update-text">' + renderUpdateBody(taskId, u) + '</div>' +
        '<div class="update-actions">' +
          '<button class="update-action-btn' + (u.liked ? ' liked' : '') + '" data-action="toggle-like" data-task="' + taskId + '" data-update="' + u.id + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="' + (u.liked ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="M7 22V11M2 13v7a2 2 0 002 2h12.6a2 2 0 002-1.7l1.3-8a2 2 0 00-2-2.3H14V5a2 2 0 00-2-2l-2 7H2z"/></svg>' +
            (u.likes ? u.likes + " " : "") + tr("panel.like") + '</button>' +
          '<button class="update-action-btn" data-action="focus-reply" data-update="' + u.id + '" data-author="' + esc(u.author || "You") + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17l-5-5 5-5M4 12h11a5 5 0 015 5v1"/></svg>' + tr("panel.reply") + '</button>' +
        '</div>' +
        repliesHtml +
      '</div>' +
    '</div>';
  }

  function renderReplyItem(taskId, u) {
    return '<div class="update-item update-reply-item">' +
      '<div class="update-avatar" style="background:' + avatarColor(u.author) + '">' + esc(initials(u.author)) + '</div>' +
      '<div class="update-main">' +
        '<div class="update-head"><span class="update-author">' + esc(u.author || "You") + '</span><span class="update-time">' + PM.timeAgo(u.time) + '</span></div>' +
        '<div class="update-text">' + renderUpdateBody(taskId, u) + '</div>' +
        '<div class="update-actions">' +
          '<button class="update-action-btn' + (u.liked ? ' liked' : '') + '" data-action="toggle-like" data-task="' + taskId + '" data-update="' + u.id + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="' + (u.liked ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="M7 22V11M2 13v7a2 2 0 002 2h12.6a2 2 0 002-1.7l1.3-8a2 2 0 00-2-2.3H14V5a2 2 0 00-2-2l-2 7H2z"/></svg>' +
            (u.likes ? u.likes + " " : "") + tr("panel.like") + '</button>' +
          '<button class="update-action-btn" data-action="focus-reply" data-update="' + (u.parentId || u.id) + '" data-author="' + esc(u.author || "You") + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17l-5-5 5-5M4 12h11a5 5 0 015 5v1"/></svg>' + tr("panel.reply") + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  function postUpdate(taskId, content, source, parentId) {
    var isHtml = source === "compose";
    var storedText;
    if (isHtml) {
      var tmp = document.createElement("div");
      tmp.innerHTML = content || "";
      // Non-text content (an attached image, a table, a divider line) is
      // still a real post even with no visible text, so don't bail out on
      // an empty textContent alone.
      var hasMedia = !!tmp.querySelector("img,table,hr");
      if (!tmp.textContent.trim() && !hasMedia) return;
      storedText = sanitizeComposeHtml(unwrapChecklistMarkers(content));
    } else {
      var clean = (content || "").trim();
      if (!clean) return;
      storedText = clean;
    }
    var ctx = findUpdatable(taskId);
    if (!ctx) return;
    var t = ctx.item;
    t.updates = t.updates || [];
    var authorName = (PM.currentUser && PM.currentUser.name) || "You";
    var newUpdate = { id: uid(), author: authorName, time: new Date().toISOString(), text: storedText, likes: 0, liked: false, isHtml: isHtml, parentId: parentId || null };
    t.updates.push(newUpdate);
    persist();
    render();
    notifyMentionedMembers(ctx, storedText, isHtml, authorName);
    if (source === "compose") {
      var el = document.getElementById("composeInput");
      if (el) el.focus();
    }
  }

  // Turns "@Name" in a just-posted update into a real notification on that
  // person's account (sidebar bell) — not just text sitting in the thread.
  // Matched against this project's member list (real accounts only), longest
  // name first so "Nam" doesn't shadow-match inside "Namfon". `ctx` is a
  // findUpdatable() result: the notification always links to the *parent*
  // task (the notifications table's task_id FK only knows about tasks), but
  // the message names whichever item — task or subitem — was actually posted to.
  function notifyMentionedMembers(ctx, storedText, isHtml, authorName) {
    if (!PM.currentProjectId || !projectMembersFull.length) return;
    var plainText = isHtml ? stripHtml(storedText) : storedText;
    var sortedMembers = projectMembersFull.slice().sort(function (a, b) { return (b.name || "").length - (a.name || "").length; });
    var mentioned = [];
    sortedMembers.forEach(function (u) {
      if (!u.name || mentioned.indexOf(u) !== -1) return;
      var re = new RegExp("@" + u.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\wก-๙])", "u");
      if (re.test(plainText)) mentioned.push(u);
    });
    if (!mentioned.length) return;
    var excerpt = plainText.length > 80 ? plainText.slice(0, 80) + "…" : plainText;
    mentioned.forEach(function (u) {
      PM.createNotification({
        toUserId: u.id,
        projectId: PM.currentProjectId,
        taskId: ctx.parentTask.id,
        message: tr("sb.mentionMessage").replace("{name}", authorName).replace("{task}", ctx.item.name || "").replace("{excerpt}", excerpt)
      }).catch(function () {});
    });
  }
  function toggleLike(taskId, updateId) {
    var ctx = findUpdatable(taskId);
    if (!ctx) return;
    var t = ctx.item;
    var u = (t.updates || []).find(function (x) { return x.id === updateId; });
    if (!u) return;
    u.liked = !u.liked;
    u.likes = Math.max(0, (u.likes || 0) + (u.liked ? 1 : -1));
    persist(); renderPanel();
  }

  // ---------------- checklist items in posted updates ----------------
  // A checklist item is just a "☐"/"☑" glyph inline in the update's stored
  // text (inserted by the compose toolbar's Checklist button). At render
  // time each glyph becomes a real, clickable checkbox; clicking it flips
  // the glyph in the stored text and saves — so the checklist is genuinely
  // interactive, not a static icon.
  var CHECKLIST_MARKER_RE = /(☐|☑)/g;

  function renderChecklistMarkers(html, taskId, updateId) {
    var idx = -1;
    return (html || "").replace(CHECKLIST_MARKER_RE, function (m) {
      idx++;
      var checked = m === "☑";
      return '<input type="checkbox" class="checklist-checkbox" data-action="toggle-checklist" ' +
        'data-task="' + esc(taskId) + '" data-update="' + esc(updateId) + '" data-idx="' + idx + '"' +
        (checked ? " checked" : "") + " />";
    });
  }

  function toggleChecklistItem(taskId, updateId, idx) {
    var ctx = findUpdatable(taskId);
    if (!ctx) return;
    var t = ctx.item;
    var u = (t.updates || []).find(function (x) { return x.id === updateId; });
    if (!u) return;
    var count = -1;
    u.text = (u.text || "").replace(CHECKLIST_MARKER_RE, function (m) {
      count++;
      if (count !== idx) return m;
      return m === "☐" ? "☑" : "☐";
    });
    persist(); renderPanel();
  }

  // ---------------- mutations ----------------

  function addGroup() {
    PM.state.groups.push({ id: uid(), name: "New group", color: PM.GROUP_COLORS[PM.state.groups.length % PM.GROUP_COLORS.length], collapsed: false });
    persist(); render();
  }
  function firstOpenGroupId() {
    var g = PM.state.groups.find(function (g) { return !g.collapsed; }) || PM.state.groups[0];
    return g ? g.id : null;
  }
  function addTask(groupId) {
    if (!groupId) return;
    var t = { id: uid(), groupId: groupId, name: "", owner: "", status: "not_started", folder: "", start: "", due: "", subitemsOpen: false, subitems: [], updates: [], stuckReason: "", stuckAttachments: [] };
    PM.state.tasks.push(t);
    persist(); render();
    var el = document.querySelector('.task-row[data-task="' + t.id + '"] .task-name-input');
    if (el) el.focus();
  }
  function addSubitem(taskId) {
    var t = findTask(taskId);
    if (!t) return;
    t.subitemsOpen = true;
    t.subitems.push({ id: uid(), name: "", owner: "", status: "not_started", date: "", folder: "", updates: [], stuckReason: "", stuckAttachments: [] });
    persist(); render();
    var el = document.querySelector('.subitem-row:last-child input[data-field="sub-name"][data-task="' + taskId + '"]');
    if (el) el.focus();
  }
  function deleteSelected() {
    var n = selected.size;
    if (!n) return;
    if (!confirm('Delete ' + n + ' selected item(s)? This cannot be undone.')) return;
    selected.forEach(function (key) {
      var parts = key.split(":");
      if (parts[0] === "task") {
        PM.state.tasks = PM.state.tasks.filter(function (t) { return t.id !== parts[1]; });
      } else if (parts[0] === "sub") {
        var t = findTask(parts[1]);
        if (t) t.subitems = t.subitems.filter(function (s) { return s.id !== parts[2]; });
      }
    });
    selected.clear();
    persist(); render();
    showToast("Deleted " + n + " item(s)");
  }
  function exportSelected() {
    var tasks = [];
    selected.forEach(function (key) {
      var parts = key.split(":");
      if (parts[0] === "task") { var t = findTask(parts[1]); if (t) tasks.push(t); }
    });
    doExport(tasks.length ? { title: PM.state.title, groups: PM.state.groups, tasks: tasks } : PM.state);
  }
  async function doExport(data) {
    var json = JSON.stringify(data, null, 2);
    var rawTitle = (PM.state.title || "it-project-board").trim();
    var filename = (rawTitle.replace(/[\\/:*?"<>|]+/g, "_").replace(/\s+/g, "_") || "it-project-board").slice(0, 60) + ".json";
    if (window.claude && window.claude.downloads) {
      try {
        await window.claude.downloads.save({ filename: filename, data: json });
        showToast("Saved " + filename);
      } catch (err) {
        showToast(err && err.code === "declined" ? "Save cancelled" : "Couldn't save the file right now");
      }
    } else {
      showToast("File downloads aren't available in this view");
    }
  }

  // ---------------- events ----------------

  document.getElementById("boardTitle").addEventListener("input", function (e) { PM.state.title = e.target.value; persist(); PM.syncSidebarLinks(); });

  // ---------------- save status ----------------
  // Reflects PM.persist()'s debounced auto-save (idle/dirty/saving/saved/
  // error) so a failed PUT is never silent, plus a manual Save button that
  // flushes immediately regardless of the debounce timer.
  (function () {
    var el = document.getElementById("saveStatus");
    var textEl = document.getElementById("saveStatusText");
    var saveBtn = document.getElementById("saveNowBtn");
    PM.onSaveStatus(function (state) {
      el.dataset.state = state;
      textEl.textContent = tr("save." + state);
      el.title = state === "error" ? tr("save.error") : "";
      // Red while there's unsaved/unconfirmed work (dirty, mid-save, or
      // failed) — back to normal once the server has confirmed the save.
      saveBtn.classList.toggle("dirty", state === "dirty" || state === "saving" || state === "error");
    });
    el.addEventListener("click", function () {
      if (PM.getSaveStatus() === "error") PM.saveNow();

    if (field === "range-start" || field === "range-due") return; // committed on change (blur/Enter), not per keystroke

      var s = findSub(taskId, el.dataset.sub);
      if (!s) return;
      if (field === "sub-name") s.name = el.value;
      if (field === "sub-status") {

  // dropping it flat at the end of the list — the target sticks until

  function setReplyTarget(updateId, author) {
    replyTargetUpdateId = updateId || null;

    updateReplyTargetChip(ctx ? (ctx.item.updates || []) : []);

      replyTargetUpdateId = null;
      chip.style.display = "none";
      return;
    }
    var target = updates.find(function (u) { return u.id === replyTargetUpdateId; });

    replyMentionPopover.style.zIndex = "95";
    document.body.appendChild(replyMentionPopover);
    return replyMentionPopover;

  function insertIntoReplyInput(text) {
    var el = replyInputEl;
    var start = el.selectionStart != null ? el.selectionStart : el.value.length;
    var end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
    el.value = el.value.slice(0, start) + text + el.value.slice(end);
    el.focus();
    var pos = start + text.length;
    el.setSelectionRange(pos, pos);
  }

  // loader — always includes the creator, since the server auto-adds them
