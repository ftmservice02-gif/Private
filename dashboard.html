  <!-- ============ Main area ============ -->
  <div class="main-area" id="mainArea">

      </div>
      <h1 class="db-title" data-i18n="sb.dashboard">Dashboard and reporting</h1>
      <div class="db-sub" id="dbSub"></div>
      <div class="db-duration-card" id="dbDuration"></div>
      <div class="db-tiles" id="dbTiles"></div>

        <div class="db-legend" id="dbLegend"></div>
      </div>
      <div id="dbGroupList"></div>
      <div class="db-gantt-wrap">

<div class="toast" id="toast"></div>

<script src="shared/shared.js?v=67"></script>
<script>
(function () {
  "use strict";
  var PM = window.PM;

  function esc(s) { return PM.esc(s); }
  function tr(key) { return PM.tr(key); }
  function statusLabel(k) { return PM.statusLabel(k); }
  function fmtDate(s) { return PM.fmtDate(s); }
  function todayIso() { return PM.todayIso(); }
  function daysBetweenInclusive(a, b) { return PM.daysBetweenInclusive(a, b); }
  function taskDurationDays(t) { return PM.taskDurationDays(t); }
  function taskDurationPct(t, total) { return PM.taskDurationPct(t, total); }
  function projectDateBounds() { return PM.projectDateBounds(); }

  function dbTile(num, label, cls) {
    return '<div class="db-tile ' + cls + '"><div class="db-tile-num">' + num + '</div><div class="db-tile-label">' + label + '</div></div>';
  }

  // Prefers the manually-set Total project days budget (from the Board toolbar) as the
  // headline number, falling back to the calendar span of task dates when no budget is set.
  function renderProjectDuration() {
    var el = document.getElementById("dbDuration");
    var bounds = projectDateBounds();
    var budget = PM.state.totalDaysBudget;
    if (!bounds && !budget) {
      el.innerHTML = '<div class="db-gantt-empty">' + esc(tr("db.noTimeline")) + '</div>';
      return;
    }
    var totalDays = budget || daysBetweenInclusive(bounds.start, bounds.end);
    var elapsed = 0;
    if (bounds) {
      var today = todayIso();
      var clampedToday = today < bounds.start ? bounds.start : today;
      elapsed = Math.max(0, daysBetweenInclusive(bounds.start, clampedToday));
    }
    var pct = totalDays ? Math.min(100, Math.round((elapsed / totalDays) * 100)) : 0;
    var headLabel = tr("db.projectDuration") + (bounds ? " · " + fmtDate(bounds.start) + " – " + fmtDate(bounds.end) : "");
    var subLabel = PM.lang === "th"
      ? ("วันที่ " + elapsed + " จาก " + totalDays + " วัน · ผ่านไปแล้ว " + pct + "%")
      : ("Day " + elapsed + " of " + totalDays + " · " + pct + "% elapsed");
    el.innerHTML =
      '<div class="db-duration-num">' + totalDays + '<small>' + esc(tr("db.days")) +
        (budget ? ' · ' + esc(tr("db.budgetTag")) : '') + '</small></div>' +
      '<div class="db-duration-meta">' +
        '<div class="db-duration-range">' + esc(headLabel) + '</div>' +
        '<div class="db-duration-track"><div class="db-duration-fill" style="width:' + pct + '%;"></div></div>' +
        '<div class="db-duration-sub">' + esc(subLabel) + '</div>' +
      '</div>';
  }

  function renderGanttChart() {
    var el = document.getElementById("dbGantt");
    var bounds = projectDateBounds();
    if (!bounds || !PM.state.tasks.length) {
      el.innerHTML = '<div class="db-gantt-empty">' + esc(tr("db.noTimeline")) + '</div>';
      return;
    }
    var totalDays = daysBetweenInclusive(bounds.start, bounds.end);
    var todayPct = PM.pctFromStart(todayIso(), bounds, totalDays);
    var todayLine = todayPct !== null ? '<div class="db-gantt-today-line" style="left:' + todayPct + '%;"></div>' : "";

    var scaleHtml = '<div class="db-gantt-scale"><div class="db-gantt-scale-label"></div>' +
      '<div class="db-gantt-scale-track">' +
        PM.monthTicks(bounds).map(function (m) { return '<div class="db-gantt-tick" style="left:' + m.pct + '%;">' + esc(m.label) + '</div>'; }).join("") +
      '</div></div>';

    var rowsHtml = PM.state.groups.map(function (g) {
      var gTasks = PM.state.tasks.filter(function (t) { return t.groupId === g.id; });
      if (!gTasks.length) return "";
      var rows = gTasks.map(function (t) {
        var pos = PM.barPosition(t, bounds, totalDays);
        var durDays = taskDurationDays(t);
        var durPct = taskDurationPct(t, totalDays);
        var dayWord = PM.lang === "th" ? "วัน" : (durDays === 1 ? "day" : "days");
        var pctWord = PM.lang === "th" ? "ของระยะเวลาโครงการ" : "of project duration";
        var bar = pos
          ? '<div class="db-gantt-bar status-' + t.status + '" style="left:' + pos.left + '%;width:' + pos.width + '%;" title="' +
              esc(t.name) + ' — ' + durDays + ' ' + dayWord + ' (' + durPct + '% ' + pctWord + ')">' +
              '<span>' + durDays + (PM.lang === "th" ? "ว" : "d") + '</span>' +
              (pos.width > 10 ? '<span class="db-gantt-bar-pct">' + durPct + '%</span>' : '') +
            '</div>'
          : "";
        return '<div class="db-gantt-row"><div class="db-gantt-row-label" title="' + esc(t.name) + '">' + esc(t.name) + '</div>' +
          '<div class="db-gantt-track">' + todayLine + bar + '</div></div>';
      }).join("");
      return '<div class="db-gantt-group-head" style="color:' + g.color + ';">' + esc(g.name) + '</div>' + rows;
    }).join("");

    el.innerHTML = scaleHtml + '<div class="db-gantt-body">' + rowsHtml + '</div>';
  }

  function renderDashboard() {
    var counts = { not_started: 0, working: 0, stuck: 0, done: 0 };
    PM.state.tasks.forEach(function (t) { counts[t.status] = (counts[t.status] || 0) + 1; });
    var total = PM.state.tasks.length;

    var titleText = PM.state.title || "Untitled project";
    document.getElementById("dbSub").textContent = PM.lang === "th"
      ? (total + " งาน ในทั้งหมด " + PM.state.groups.length + " กลุ่ม ของ “" + titleText + "”")
      : (total + " task" + (total === 1 ? "" : "s") + " across " + PM.state.groups.length + " group" + (PM.state.groups.length === 1 ? "" : "s") + " in “" + titleText + "”");

    document.getElementById("dbTiles").innerHTML =
      dbTile(total, tr("db.totalTasks"), "") +
      dbTile(counts.not_started, statusLabel("not_started"), "") +
      dbTile(counts.working, statusLabel("working"), "working") +
      dbTile(counts.stuck, statusLabel("stuck"), "stuck") +
      dbTile(counts.done, statusLabel("done"), "done");

    var segs = [
      { key: "done", color: "var(--done-bg)", n: counts.done },
      { key: "working", color: "var(--working-bg)", n: counts.working },
      { key: "stuck", color: "var(--stuck-bg)", n: counts.stuck },
      { key: "not_started", color: "var(--notstarted-bg)", n: counts.not_started }
    ];
    document.getElementById("dbStackBar").innerHTML = total ? segs.map(function (s) {
      var pct = (s.n / total) * 100;
      return pct > 0 ? '<div class="db-stack-seg" style="width:' + pct + '%;background:' + s.color + ';"></div>' : '';
    }).join("") : "";
    document.getElementById("dbLegend").innerHTML = segs.map(function (s) {
      return '<div class="db-legend-item"><span class="db-legend-dot" style="background:' + s.color + ';"></span>' +
        statusLabel(s.key) + ' (' + s.n + ')</div>';
    }).join("");

    document.getElementById("dbGroupList").innerHTML = PM.state.groups.map(function (g) {
      var gTasks = PM.state.tasks.filter(function (t) { return t.groupId === g.id; });
      var gDone = gTasks.filter(function (t) { return t.status === "done"; }).length;
      var pct = gTasks.length ? Math.round((gDone / gTasks.length) * 100) : 0;
      return '<div class="db-group-row">' +
        '<div class="db-group-name" style="color:' + g.color + ';">' + esc(g.name) + '</div>' +
        '<div class="db-group-track"><div class="db-group-fill" style="width:' + pct + '%;background:' + g.color + ';"></div></div>' +
        '<div class="db-group-frac">' + gDone + ' / ' + gTasks.length + '</div>' +
      '</div>';
    }).join("");

    renderProjectDuration();
    renderGanttChart();
  }

  function render() {
    renderDashboard();
    PM.syncSidebarLinks();
    PM.renderSidebarProgress();
  }

  // ---------------- init ----------------
  // Gated: nothing else runs until the session is confirmed valid server-side.

  PM.requireAuth().then(function () {
    PM.resolveProjectId();
    PM.state = PM.loadCachedState() || PM.seedState();
    PM.initSidebar("dashboard", render);
    render();

    var idOrNull = PM.currentProjectId || null;
    PM.fetchProjectState(idOrNull).then(function (data) {
      PM.state = data;
      if (!PM.currentProjectId && data.id) {
        PM.currentProjectId = data.id;
        try { localStorage.setItem(PM.CURRENT_PROJECT_KEY, data.id); } catch (e) {}
      }
      render();
    }).catch(function () {
      PM.showToast("Offline — using local data (API unreachable)");
    });
  }).catch(function () {}); // requireAuth already redirected to login.html
})();
</script>
